<!-- Loading Placeholder Script (Micro-interaction) -->
<script>
        const retryBtn = document.getElementById('retryBtn');
        retryBtn.addEventListener('click', () => {
            const originalContent = retryBtn.innerHTML;
            retryBtn.disabled = true;
            retryBtn.innerHTML = `
                <div class="flex items-center justify-center gap-sm">
                    <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                    <span>Retrying...</span>
                </div>
            `;
            
            // Simulate a network check
            setTimeout(() => {
                retryBtn.innerHTML = originalContent;
                retryBtn.disabled = false;
                // Add a subtle thump haptic simulation via scale
                retryBtn.classList.add('scale-105');
                setTimeout(() => retryBtn.classList.remove('scale-105'), 200);
            }, 2000);
        });
    </script>
