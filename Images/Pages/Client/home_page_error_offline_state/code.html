<body class="bg-background text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface/90 dark:bg-surface/90 flex justify-between items-center h-16 px-container-margin">
<div class="flex items-center gap-base active:scale-95 transition-transform duration-200 cursor-pointer">
<span class="material-symbols-outlined text-primary dark:text-on-primary-fixed" data-icon="location_on">location_on</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight text-primary dark:text-on-primary-fixed">LUXE</h1>
<div class="flex items-center gap-base active:scale-95 transition-transform duration-200 cursor-pointer">
<span class="material-symbols-outlined text-primary dark:text-on-primary-fixed" data-icon="search">search</span>
</div>
</header>
<!-- Main Content: Empty State Canvas -->
<main class="min-h-screen pt-16 pb-24 flex flex-col items-center justify-center px-container-margin text-center">
<!-- Premium Illustration Area -->
<div class="relative w-full max-w-sm aspect-square mb-xl animate-fade-in">
<div class="absolute inset-0 flex items-center justify-center">
<!-- Outer Decorative Rings for Depth -->
<div class="absolute w-72 h-72 border border-outline-variant/30 rounded-full animate-[pulse_4s_ease-in-out_infinite]"></div>
<div class="absolute w-56 h-56 border border-outline-variant/50 rounded-full animate-[pulse_3s_ease-in-out_infinite]"></div>
<!-- Hero Image -->
<div class="relative z-10 w-64 h-64 overflow-hidden rounded-xl bg-surface-container-low shadow-sm border border-outline-variant/20">
<img class="w-full h-full object-cover" data-alt="A premium, minimalist 3D render of a sleek designer shopping bag in textured charcoal black, floating in a serene, bright white studio space. The bag has a distinct, clean break in its handle to symbolize a lost connection. Soft, diffused cinematic lighting casts gentle ambient shadows, creating a high-end luxury aesthetic. The overall mood is quiet and sophisticated, using a palette of deep obsidian and pristine paper white." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9QVeW2paeuHctonNDhY2i-0nWp17DBjorOY6-edYKLb8mqgzlFTe4HicjfrF50rt2kyzKFWn7KvODWJG1n_y5Z5cfC0yfbWERETz0r1hmpoccxIMle7B69EGaFiNEoCrbOvMNTcTWx095kp51OpsEJx6I9Jn2440KxwTwvAfrfSNYtI0MqwMp5eMJbXpnBUrZ6q7ao-aB67OS6pTnfJqhR9fMd74WCVEwJY_Y2BORFpUSI3DXBgjqJA">
<!-- Overlay Icon for Clarity -->
<div class="absolute bottom-4 right-4 bg-primary text-on-primary p-base rounded-full shadow-lg">
<span class="material-symbols-outlined text-[20px]" data-icon="cloud_off">cloud_off</span>
</div>
</div>
</div>
</div>
<!-- Typography Section -->
<div class="space-y-sm max-w-xs">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">You're Offline</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Check your connection to continue shopping.</p>
</div>
<!-- Action Section -->
<div class="mt-xl w-full max-w-xs flex flex-col gap-md">
<!-- Primary Button -->
<button class="h-14 bg-primary text-on-primary rounded-lg font-title-lg text-title-lg flex items-center justify-center haptic-feedback transition-all hover:opacity-90 active:scale-95" onclick="handleRetry()">
<span id="retry-text" class="">Retry</span>
<div class="hidden w-5 h-5 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin" id="retry-loader"></div>
</button>
<!-- Secondary Button -->

</div>
<!-- Support Subtext -->
<p class="mt-lg font-label-md text-label-md text-outline">
            Error Code: DX-404-NO-CONN
        </p>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 backdrop-blur-md bg-surface/90 dark:bg-surface/90 flex justify-around items-center px-container-margin py-base pb-safe">
<!-- Shop (Active - Mapping Home/Shop to current context) -->
<div class="flex flex-col items-center justify-center text-primary dark:text-on-primary-fixed font-bold active:scale-90 transition-transform duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="storefront" style="font-variation-settings: 'FILL' 1;">storefront</span>
<span class="font-label-md text-label-md">Shop</span>
</div>
<!-- Explore -->

<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-label-md text-label-md">Explore</span>
</div>
<!-- Cart -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-90 transition-transform duration-200 cursor-pointer px-sm rounded-lg">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
<span class="font-label-md text-label-md">Cart</span>
</div>
<!-- Wishlist -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-90 transition-transform duration-200 cursor-pointer px-sm rounded-lg">
<span class="material-symbols-outlined" data-icon="favorite">favorite</span>
<span class="font-label-md text-label-md">Wishlist</span>
</div>
<!-- Profile -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-90 transition-transform duration-200 cursor-pointer px-sm rounded-lg">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</div>
</nav>
<script>
        function handleRetry() {
            const btnText = document.getElementById('retry-text');
            const loader = document.getElementById('retry-loader');
            
            // Interaction Feedback
            btnText.classList.add('hidden');
            loader.classList.remove('hidden');
            
            // Simulate check
            setTimeout(() => {
                loader.classList.add('hidden');
                btnText.classList.remove('hidden');
                btnText.innerText = "Reconnecting...";
                
                setTimeout(() => {
                    btnText.innerText = "Retry";
                }, 1000);
            }, 1500);
        }

        // Handle simple parallax-like hover effect on illustration if on desktop
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 100;
                const moveY = (e.clientY - window.innerHeight / 2) / 100;
                const illustration = document.querySelector('.relative.z-10');
                if (illustration) {
                    illustration.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            });
        }
    </script>
