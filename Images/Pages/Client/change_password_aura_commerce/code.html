<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Aura Commerce - Change Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e0e3e5",
                        "outline-variant": "#c6c6cc",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-tertiary-fixed-variant": "#38485d",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#45464c",
                        "surface-bright": "#f7f9fb",
                        "inverse-on-surface": "#eff1f3",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#f7dec5",
                        "secondary": "#6d5b48",
                        "surface-variant": "#e0e3e5",
                        "primary": "#000000",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#dac3aa",
                        "surface": "#f7f9fb",
                        "primary-container": "#151b29",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary-container": "#75859d",
                        "on-secondary-fixed": "#26190a",
                        "on-secondary-fixed-variant": "#544432",
                        "outline": "#76777d",
                        "tertiary-fixed": "#d3e4fe",
                        "primary-fixed-dim": "#c1c6d9",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#7e8395",
                        "on-secondary-container": "#73614d",
                        "on-background": "#191c1e",
                        "inverse-primary": "#c1c6d9",
                        "inverse-surface": "#2d3133",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f2f4f6",
                        "tertiary": "#000000",
                        "tertiary-container": "#0b1c30",
                        "secondary-container": "#f7dec5",
                        "background": "#f7f9fb",
                        "primary-fixed": "#dde2f6",
                        "surface-tint": "#585e6f",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#151b29",
                        "on-surface": "#191c1e",
                        "on-primary-fixed-variant": "#414756",
                        "surface-container": "#eceef0",
                        "surface-dim": "#d8dadc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "xs": "4px",
                        "md": "16px",
                        "sm": "12px",
                        "container-margin": "20px",
                        "lg": "24px",
                        "xl": "32px",
                        "gutter": "12px"
                    },
                    "fontFamily": {
                        "price-display": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "title-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "price-display": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "600" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom input focus glow */
        .input-glow:focus-within {
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-background min-h-screen text-on-surface antialiased flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-surface/90 dark:bg-surface-container-lowest/90 flex justify-between items-center h-16 px-container-margin transition-all duration-300">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center text-primary dark:text-on-surface hover:opacity-80 transition-opacity active:scale-95 duration-200 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-tight text-primary dark:text-on-surface absolute left-1/2 -translate-x-1/2">
            Change Password
        </h1>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content -->
<main class="flex-grow pt-[88px] px-container-margin pb-[120px] max-w-md mx-auto w-full flex flex-col gap-lg">
<p class="font-body-md text-body-md text-on-surface-variant mb-4">
            Ensure your account is using a long, random password to stay secure.
        </p>
<!-- Form Container -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<!-- Current Password -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-surface" for="current-password">Current Password</label>
<div class="relative w-full input-glow rounded group">
<input class="w-full bg-[#F1F5F9] border-none rounded font-body-md text-body-md text-on-surface px-4 py-3 pr-12 focus:ring-0 focus:outline-none focus:border-primary border border-transparent focus:border-[1.5px]" id="current-password" placeholder="Enter current password" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<!-- New Password -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-surface" for="new-password">New Password</label>
<div class="relative w-full input-glow rounded group">
<input class="w-full bg-[#F1F5F9] border-none rounded font-body-md text-body-md text-on-surface px-4 py-3 pr-12 focus:ring-0 focus:outline-none focus:border-primary border border-transparent focus:border-[1.5px]" id="new-password" placeholder="Create new password" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="mt-2 flex flex-col gap-xs">
<div class="flex justify-between items-center">
<span class="font-label-md text-label-md text-on-surface-variant">Password Strength</span>
<span class="font-label-md text-label-md text-on-surface-variant" id="strength-text">Weak</span>
</div>
<div class="flex gap-1 h-1.5 w-full">
<div class="flex-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-error transition-all duration-300 w-1/3" id="strength-bar-1"></div>
</div>
<div class="flex-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-surface-container-highest transition-all duration-300 w-0" id="strength-bar-2"></div>
</div>
<div class="flex-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-surface-container-highest transition-all duration-300 w-0" id="strength-bar-3"></div>
</div>
</div>
<ul class="mt-2 font-label-md text-label-md text-outline flex flex-col gap-1">
<li class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">check</span> At least 8 characters</li>
<li class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">check</span> One number or symbol</li>
</ul>
</div>
</div>
<!-- Confirm New Password -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password">Confirm New Password</label>
<div class="relative w-full input-glow rounded group">
<input class="w-full bg-[#F1F5F9] border-none rounded font-body-md text-body-md text-on-surface px-4 py-3 pr-12 focus:ring-0 focus:outline-none focus:border-primary border border-transparent focus:border-[1.5px]" id="confirm-password" placeholder="Confirm new password" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-container-margin pb-lg bg-surface/90 backdrop-blur-xl z-40 border-t border-outline-variant/20">
<div class="max-w-md mx-auto w-full">
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg py-4 rounded-full active:scale-[0.98] transition-transform duration-200 shadow-sm flex items-center justify-center gap-2">
                Update Password
            </button>
</div>
</div>
<script>
        // Password Visibility Toggle Logic
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                    icon.style.fontVariationSettings = "'FILL' 1";
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                    icon.style.fontVariationSettings = "'FILL' 0";
                }
                
                // Light haptic feedback simulation (for actual native apps)
                if (navigator.vibrate) navigator.vibrate(5);
            });
        });

        // Simple Password Strength Simulation
        const newPasswordInput = document.getElementById('new-password');
        const strengthText = document.getElementById('strength-text');
        const bar1 = document.getElementById('strength-bar-1');
        const bar2 = document.getElementById('strength-bar-2');
        const bar3 = document.getElementById('strength-bar-3');

        newPasswordInput.addEventListener('input', function() {
            const val = this.value;
            let strength = 0;
            
            if (val.length > 0) strength = 1;
            if (val.length >= 8) strength = 2;
            if (val.length >= 8 && (/\d/.test(val) || /[!@#$%^&*]/.test(val))) strength = 3;

            // Reset bars
            bar1.className = "h-full transition-all duration-300 w-0";
            bar2.className = "h-full transition-all duration-300 w-0";
            bar3.className = "h-full transition-all duration-300 w-0";

            if (strength === 0) {
                strengthText.textContent = "";
            } else if (strength === 1) {
                strengthText.textContent = "Weak";
                bar1.className = "h-full bg-error transition-all duration-300 w-full";
            } else if (strength === 2) {
                strengthText.textContent = "Medium";
                bar1.className = "h-full bg-secondary transition-all duration-300 w-full";
                bar2.className = "h-full bg-secondary transition-all duration-300 w-full";
            } else if (strength === 3) {
                strengthText.textContent = "Strong";
                bar1.className = "h-full bg-primary transition-all duration-300 w-full";
                bar2.className = "h-full bg-primary transition-all duration-300 w-full";
                bar3.className = "h-full bg-primary transition-all duration-300 w-full";
            }
        });
    </script>
</body></html>
