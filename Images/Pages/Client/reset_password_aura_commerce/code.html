<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Smooth transitions */
        .transition-all-300 {
            transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Custom minimal input styles */
        .minimal-input {
            background-color: #F1F5F9;
            border: 1.5px solid transparent;
            outline: none;
            transition: all 0.2s ease;
        }

        .minimal-input:focus {
            border-color: #000000;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
        }

        /* Password strength bar */
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            background-color: #E2E8F0;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* Haptic simulation keyframes */
        @keyframes subtle-bump {
            0% { transform: scale(1); }
            50% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }
        .animate-bump {
            animation: subtle-bump 150ms ease-in-out;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:max-w-md md:mx-auto md:border-x md:border-outline-variant/30 md:shadow-2xl relative bg-surface-container-lowest">
<!-- TopAppBar (Transactional - simplified, no shell nav logic applied as this is a transactional screen) -->
<header class="flex items-center justify-between px-container-margin py-lg w-full bg-surface-container-lowest z-10 sticky top-0">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-[24px] text-on-surface">arrow_back</span>
</button>
<div class="font-title-lg text-title-lg font-bold text-primary opacity-0" id="header-title">Reset Password</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-container-margin pt-sm pb-xl relative z-0">
<!-- Header Text -->
<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-xs">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create a new, strong password for your Aura Commerce account.</p>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-lg" id="reset-password-form" onsubmit="event.preventDefault(); submitForm();">
<!-- New Password Field -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="new-password">New Password</label>
<div class="relative">
<input class="minimal-input w-full rounded-lg px-md py-sm font-body-lg text-body-lg text-on-surface placeholder-outline-variant" id="new-password" oninput="checkStrength(this.value)" placeholder="Enter new password" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors p-xs" onclick="togglePasswordVisibility('new-password', 'toggle-icon-1')" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggle-icon-1">visibility_off</span>
</button>
</div>
<!-- Real-time Strength Indicator -->
<div class="mt-sm flex flex-col gap-xs">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-on-surface-variant" id="strength-text">Strength: None</span>
</div>
<div class="flex gap-xs w-full">
<div class="strength-bar flex-1"><div class="strength-fill" id="bar-1"></div></div>
<div class="strength-bar flex-1"><div class="strength-fill" id="bar-2"></div></div>
<div class="strength-bar flex-1"><div class="strength-fill" id="bar-3"></div></div>
<div class="strength-bar flex-1"><div class="strength-fill" id="bar-4"></div></div>
</div>
<!-- Criteria Checklist -->
<ul class="mt-xs flex flex-col gap-[2px]">
<li class="flex items-center gap-xs font-label-md text-label-md text-outline" id="crit-length">
<span class="material-symbols-outlined text-[14px]">check_circle</span> 8+ characters
                        </li>
<li class="flex items-center gap-xs font-label-md text-label-md text-outline" id="crit-number">
<span class="material-symbols-outlined text-[14px]">check_circle</span> Contains a number
                        </li>
<li class="flex items-center gap-xs font-label-md text-label-md text-outline" id="crit-special">
<span class="material-symbols-outlined text-[14px]">check_circle</span> Special character
                        </li>
</ul>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-xs relative mt-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="confirm-password">Confirm Password</label>
<div class="relative">
<input class="minimal-input w-full rounded-lg px-md py-sm font-body-lg text-body-lg text-on-surface placeholder-outline-variant" id="confirm-password" oninput="checkMatch()" placeholder="Re-enter new password" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors p-xs" onclick="togglePasswordVisibility('confirm-password', 'toggle-icon-2')" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggle-icon-2">visibility_off</span>
</button>
</div>
<!-- Match Indicator -->
<div class="mt-xs h-4 flex items-center">
<span class="font-label-md text-label-md text-error opacity-0 transition-opacity" id="match-error">Passwords do not match</span>
</div>
</div>
<!-- Spacer to push button to bottom on tall screens if needed, though usually flows naturally -->
<div class="flex-1 min-h-[40px]"></div>
<!-- High Contrast CTA -->
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg font-bold py-md rounded-xl transition-all-300 active:scale-[0.98] disabled:opacity-50 disabled:active:scale-100 flex items-center justify-center gap-sm relative overflow-hidden" disabled="" id="submit-btn" type="submit">
<span id="btn-text">Update Password</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1" id="btn-icon">arrow_forward</span>
<!-- Loading spinner (hidden by default) -->
<div class="absolute inset-0 flex items-center justify-center bg-primary opacity-0 pointer-events-none transition-opacity" id="btn-spinner">
<svg class="animate-spin h-6 w-6 text-on-primary" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</div>
</button>
</form>
</main>
<!-- BottomNavBar intentionally omitted as per the "Automatic Suppression" rule for transactional/linear screens -->
<script>
        // Header scroll effect
        window.addEventListener('scroll', () => {
            const title = document.getElementById('header-title');
            if (window.scrollY > 40) {
                title.style.opacity = '1';
            } else {
                title.style.opacity = '0';
            }
        });

        // Toggle password visibility
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
                icon.classList.add('text-primary');
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
                icon.classList.remove('text-primary');
            }
        }

        // Real-time strength validation
        let isStrong = false;
        
        function checkStrength(password) {
            const bar1 = document.getElementById('bar-1');
            const bar2 = document.getElementById('bar-2');
            const bar3 = document.getElementById('bar-3');
            const bar4 = document.getElementById('bar-4');
            const text = document.getElementById('strength-text');
            
            // Criteria
            const hasLength = password.length >= 8;
            const hasNumber = /\d/.test(password);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            const hasUpper = /[A-Z]/.test(password);

            // Update UI Criteria list
            updateCritUI('crit-length', hasLength);
            updateCritUI('crit-number', hasNumber);
            updateCritUI('crit-special', hasSpecial);

            let score = 0;
            if (password.length > 0) score++;
            if (hasLength) score++;
            if (hasLength && (hasNumber || hasSpecial)) score++;
            if (hasLength && hasNumber && hasSpecial && hasUpper) score++;

            // Reset widths
            [bar1, bar2, bar3, bar4].forEach(bar => { bar.style.width = '0%'; });

            // Apply colors and widths based on score
            if (score === 0) {
                text.textContent = 'Strength: None';
                text.className = 'font-label-md text-label-md text-on-surface-variant';
                isStrong = false;
            } else if (score === 1) {
                bar1.style.width = '100%';
                bar1.style.backgroundColor = '#ba1a1a'; // error red
                text.textContent = 'Strength: Weak';
                text.className = 'font-label-md text-label-md text-error';
                isStrong = false;
            } else if (score === 2) {
                bar1.style.width = '100%'; bar2.style.width = '100%';
                bar1.style.backgroundColor = '#d97706'; bar2.style.backgroundColor = '#d97706'; // amber
                text.textContent = 'Strength: Fair';
                text.className = 'font-label-md text-label-md text-[#d97706]';
                isStrong = false;
            } else if (score === 3) {
                bar1.style.width = '100%'; bar2.style.width = '100%'; bar3.style.width = '100%';
                [bar1, bar2, bar3].forEach(b => b.style.backgroundColor = '#059669'); // emerald
                text.textContent = 'Strength: Good';
                text.className = 'font-label-md text-label-md text-[#059669]';
                isStrong = true;
            } else if (score >= 4) {
                bar1.style.width = '100%'; bar2.style.width = '100%'; bar3.style.width = '100%'; bar4.style.width = '100%';
                [bar1, bar2, bar3, bar4].forEach(b => b.style.backgroundColor = '#000000'); // primary black for max strength
                text.textContent = 'Strength: Excellent';
                text.className = 'font-label-md text-label-md text-primary font-bold';
                isStrong = true;
            }

            checkMatch(); // Re-check match when new password changes
        }

        function updateCritUI(id, isMet) {
            const el = document.getElementById(id);
            const icon = el.querySelector('span');
            if (isMet) {
                el.classList.remove('text-outline');
                el.classList.add('text-primary');
                // icon.classList.add('text-primary');
                // icon.style.fontVariationSettings = "'FILL' 1";
            } else {
                el.classList.add('text-outline');
                el.classList.remove('text-primary');
                // icon.classList.remove('text-primary');
                // icon.style.fontVariationSettings = "'FILL' 0";
            }
        }

        // Check if passwords match
        function checkMatch() {
            const newPass = document.getElementById('new-password').value;
            const confPass = document.getElementById('confirm-password').value;
            const errorMsg = document.getElementById('match-error');
            const btn = document.getElementById('submit-btn');
            
            let isMatch = false;

            if (confPass.length > 0) {
                if (newPass !== confPass) {
                    errorMsg.style.opacity = '1';
                    document.getElementById('confirm-password').style.borderColor = '#ba1a1a'; // error
                } else {
                    errorMsg.style.opacity = '0';
                    document.getElementById('confirm-password').style.borderColor = 'transparent';
                    isMatch = true;
                }
            } else {
                errorMsg.style.opacity = '0';
                document.getElementById('confirm-password').style.borderColor = 'transparent';
            }

            // Enable button only if strong and match
            if (isStrong && isMatch && confPass.length > 0) {
                btn.removeAttribute('disabled');
            } else {
                btn.setAttribute('disabled', 'true');
            }
        }

        // Simulate submission
        function submitForm() {
            const btn = document.getElementById('submit-btn');
            const text = document.getElementById('btn-text');
            const icon = document.getElementById('btn-icon');
            const spinner = document.getElementById('btn-spinner');

            // Haptic bump
            btn.classList.add('animate-bump');
            setTimeout(() => btn.classList.remove('animate-bump'), 150);

            // Loading state
            text.style.opacity = '0';
            icon.style.opacity = '0';
            spinner.style.opacity = '1';
            btn.setAttribute('disabled', 'true');

            // Simulate API call
            setTimeout(() => {
                spinner.style.opacity = '0';
                text.textContent = 'Password Updated';
                text.style.opacity = '1';
                icon.textContent = 'check';
                icon.style.opacity = '1';
                btn.style.backgroundColor = '#059669'; // Success color momentarily
                
                // Add success haptic class or logic here if needed
                
                setTimeout(() => {
                    // Redirect or close logic would go here
                    alert('Redirecting to login...');
                }, 1000);
            }, 1500);
        }
    </script>
</body></html>
