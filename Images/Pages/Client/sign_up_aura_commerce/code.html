<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Sign Up - Aura Commerce</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e0e3e5",
                        "surface-container-high": "#e6e8ea",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "on-background": "#191c1e",
                        "tertiary-container": "#0b1c30",
                        "primary-fixed": "#dde2f6",
                        "tertiary": "#000000",
                        "surface-dim": "#d8dadc",
                        "on-primary-fixed-variant": "#414756",
                        "secondary-fixed-dim": "#dac3aa",
                        "surface-container-low": "#f2f4f6",
                        "primary": "#000000",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#f7dec5",
                        "outline": "#76777d",
                        "on-primary-container": "#7e8395",
                        "outline-variant": "#c6c6cc",
                        "tertiary-fixed": "#d3e4fe",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "inverse-primary": "#c1c6d9",
                        "on-tertiary-fixed": "#0b1c30",
                        "surface-container": "#eceef0",
                        "on-surface-variant": "#45464c",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#151b29",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#544432",
                        "on-secondary-fixed": "#26190a",
                        "on-surface": "#191c1e",
                        "surface": "#f7f9fb",
                        "inverse-surface": "#2d3133",
                        "error": "#ba1a1a",
                        "surface-tint": "#585e6f",
                        "on-error-container": "#93000a",
                        "primary-container": "#151b29",
                        "surface-variant": "#e0e3e5",
                        "secondary-container": "#f7dec5",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary": "#6d5b48",
                        "primary-fixed-dim": "#c1c6d9",
                        "on-secondary-container": "#73614d",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary-fixed-variant": "#38485d",
                        "background": "#f7f9fb",
                        "on-tertiary-container": "#75859d"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "container-margin": "20px",
                        base: "8px",
                        sm: "12px",
                        lg: "24px",
                        xs: "4px",
                        xl: "32px",
                        md: "16px",
                        gutter: "12px"
                    },
                    fontFamily: {
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "price-display": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Inter"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["28px", { lineHeight: "34px", fontWeight: "600" }],
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "price-display": ["24px", { lineHeight: "32px", letterSpacing: "0.02em", fontWeight: "700" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "title-lg": ["20px", { lineHeight: "28px", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom Styles to augment Tailwind */
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Input Focus Glow */
        .input-glow:focus {
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
            border-color: #000;
        }
        
        /* Button Haptic Press Effect */
        .btn-press:active {
            transform: scale(0.97);
        }
        
        /* Smooth standard transitions */
        .transition-standard {
            transition: all 400ms cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col font-body-md relative overflow-x-hidden">
<!-- Top Navigation (Suppressed for Transactional Flow, keeping simple brand anchor) -->
<header class="w-full flex items-center justify-between px-container-margin py-lg z-10 sticky top-0 bg-surface/90 backdrop-blur-xl">
<a class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tighter" href="#">
            Aura
        </a>
<a class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-primary" href="#">
<span class="material-symbols-outlined" data-icon="close">close</span>
</a>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-container-margin pt-sm pb-xl max-w-md mx-auto w-full z-10">
<!-- Header Section -->
<div class="mb-xl">
<h1 class="font-display-lg text-display-lg text-primary mb-xs">Create Account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Join Aura Commerce for exclusive access to premium collections.</p>
</div>
<!-- Social Sign Up Options -->
<div class="flex flex-col gap-sm mb-lg">
<button class="w-full flex items-center justify-center gap-sm py-sm px-md rounded-lg border border-outline-variant bg-surface-container-lowest text-primary font-label-md text-label-md hover:bg-surface-container-low btn-press transition-standard">
<!-- Using an icon representation for Google for minimal aesthetic -->
<span class="material-symbols-outlined" data-icon="account_circle" style="font-variation-settings: 'FILL' 1;">account_circle</span>
                Continue with Google
            </button>
<button class="w-full flex items-center justify-center gap-sm py-sm px-md rounded-lg border border-outline-variant bg-surface-container-lowest text-primary font-label-md text-label-md hover:bg-surface-container-low btn-press transition-standard">
<span class="material-symbols-outlined" data-icon="apple" style="font-variation-settings: 'FILL' 1;">file_download</span>
                Continue with Apple
            </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-sm mb-lg">
<div class="h-px bg-outline-variant flex-grow opacity-50"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase">or sign up with email</span>
<div class="h-px bg-outline-variant flex-grow opacity-50"></div>
</div>
<!-- Sign Up Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault(); showLoading(this);">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="fullName">Full Name</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">person</span>
<input class="w-full bg-[#F1F5F9] border-none text-on-surface font-body-md text-body-md rounded-lg py-sm pl-[44px] pr-sm focus:ring-0 input-glow transition-standard placeholder:text-outline/70" id="fullName" placeholder="Jane Doe" required="" type="text">
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">Email Address</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">mail</span>
<input class="w-full bg-[#F1F5F9] border-none text-on-surface font-body-md text-body-md rounded-lg py-sm pl-[44px] pr-sm focus:ring-0 input-glow transition-standard placeholder:text-outline/70" id="email" placeholder="jane@example.com" required="" type="email">
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="phone">Phone Number</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">call</span>
<input class="w-full bg-[#F1F5F9] border-none text-on-surface font-body-md text-body-md rounded-lg py-sm pl-[44px] pr-sm focus:ring-0 input-glow transition-standard placeholder:text-outline/70" id="phone" placeholder="+1 (555) 000-0000" type="tel">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="password">Password</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">lock</span>
<input class="w-full bg-[#F1F5F9] border-none text-on-surface font-body-md text-body-md rounded-lg py-sm pl-[44px] pr-[44px] focus:ring-0 input-glow transition-standard placeholder:text-outline/70" id="password" minlength="8" placeholder="••••••••" required="" type="password">
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility_off</span>
</button>
</div>
<p class="font-label-md text-[10px] text-outline ml-xs mt-1">Must be at least 8 characters long.</p>
</div>
<!-- Submit Button -->
<button class="mt-lg w-full bg-primary text-on-primary py-sm px-lg rounded-lg font-title-lg text-title-lg h-[56px] flex items-center justify-center btn-press transition-standard relative overflow-hidden group" id="submit-btn" type="submit">
<span class="relative z-10 transition-opacity duration-200" id="submit-text">Create Account</span>
<div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<!-- Loading Spinner (Hidden by default) -->
<svg class="animate-spin h-6 w-6 text-white absolute opacity-0" fill="none" id="submit-spinner" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</button>
</form>
<!-- Sign In Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-bold hover:underline underline-offset-4 decoration-2 decoration-primary/30 transition-all" href="#">Sign In</a>
</p>
</div>
</main>
<!-- Optional: Atmospheric Background Graphic to fill darkspace elegantly -->
<div class="fixed top-0 right-0 -z-10 w-full h-full overflow-hidden pointer-events-none opacity-40">
<div class="absolute -top-[20%] -right-[10%] w-[70vw] h-[70vw] rounded-full bg-surface-container-highest blur-[100px]"></div>
<div class="absolute bottom-[10%] -left-[20%] w-[50vw] h-[50vw] rounded-full bg-surface-container-high blur-[80px]"></div>
</div>
<!-- Scripts -->
<script>
        // Password Visibility Toggle
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility';
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility_off';
            }
            
            // Subtle haptic tick if supported
            if (navigator.vibrate) navigator.vibrate(10);
        }

        // Simulate Loading State
        function showLoading(form) {
            const btn = document.getElementById('submit-btn');
            const text = document.getElementById('submit-text');
            const spinner = document.getElementById('submit-spinner');
            
            // Prevent multiple clicks
            if (btn.disabled) return;
            
            // Haptic medium thump
            if (navigator.vibrate) navigator.vibrate([15, 30, 15]);
            
            // UI State Change
            btn.disabled = true;
            text.classList.add('opacity-0');
            spinner.classList.remove('opacity-0');
            
            // Simulate network request
            setTimeout(() => {
                // Reset state for demonstration
                btn.disabled = false;
                text.classList.remove('opacity-0');
                spinner.classList.add('opacity-0');
                
                // Show success haptic
                if (navigator.vibrate) navigator.vibrate(30);
                
                // In reality, this would redirect to the app's main page
                console.log("Account created successfully");
            }, 2000);
        }
    </script>
</body></html>
