<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Currency Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e0e3e5",
                        "background": "#f7f9fb",
                        "primary-container": "#151b29",
                        "inverse-surface": "#2d3133",
                        "tertiary-container": "#0b1c30",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-fixed-variant": "#414756",
                        "surface-bright": "#f7f9fb",
                        "on-surface-variant": "#45464c",
                        "outline-variant": "#c6c6cc",
                        "secondary": "#6d5b48",
                        "on-tertiary-fixed-variant": "#38485d",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#dac3aa",
                        "on-secondary-fixed-variant": "#544432",
                        "surface-container-high": "#e6e8ea",
                        "surface-dim": "#d8dadc",
                        "tertiary": "#000000",
                        "on-error-container": "#93000a",
                        "surface-container": "#eceef0",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#f7dec5",
                        "on-secondary-container": "#73614d",
                        "surface": "#f7f9fb",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "on-secondary-fixed": "#26190a",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#c1c6d9",
                        "surface-tint": "#585e6f",
                        "on-tertiary-fixed": "#0b1c30",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#76777d",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#d3e4fe",
                        "on-background": "#191c1e",
                        "primary": "#000000",
                        "secondary-container": "#f7dec5",
                        "on-surface": "#191c1e",
                        "on-tertiary-container": "#75859d",
                        "inverse-primary": "#c1c6d9",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#151b29",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#dde2f6",
                        "on-primary-container": "#7e8395",
                        "surface-container-low": "#f2f4f6",
                        "inverse-on-surface": "#eff1f3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "md": "16px",
                        "gutter": "12px",
                        "xl": "32px",
                        "lg": "24px",
                        "sm": "12px",
                        "xs": "4px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "price-display": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "price-display": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen pb-safe">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-surface/90 flex items-center justify-between px-container-margin h-16 transition-transform duration-300">
<button aria-label="Go back" class="text-primary hover:opacity-70 transition-opacity active:scale-95 transition-transform duration-300 p-2 -ml-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-tighter text-primary">Currency</h1>
<div class="w-10"></div> <!-- Placeholder for layout balance -->
</header>
<!-- Main Content -->
<main class="pt-24 px-container-margin pb-32">
<!-- Search Bar -->
<div class="mb-lg relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="search">search</span>
<input aria-label="Search currencies" class="w-full bg-[#F1F5F9] border-none rounded-lg py-sm pl-[44px] pr-[44px] font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant focus:ring-0 focus:outline-none focus:border-primary border-[1.5px] border-transparent focus:border-solid focus:shadow-[0_0_0_4px_rgba(0,0,0,0.04)] transition-all duration-200" placeholder="Search currencies..." type="text">
<button aria-label="Clear search" class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary hidden group-focus-within:block transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Currency List -->
<section class="bg-surface-container-lowest rounded-xl p-md border border-outline-variant/30 shadow-[0_4px_20px_rgba(0,0,0,0.04)]">
<h2 class="font-title-lg text-title-lg text-on-surface mb-md">Select Currency</h2>
<div class="flex flex-col gap-sm">
<!-- Active Item -->
<button class="flex items-center justify-between p-sm rounded-lg bg-surface-container-low transition-colors duration-200 active:scale-95 group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary font-title-lg text-title-lg">$</div>
<div class="text-left">
<div class="font-body-lg text-body-lg font-semibold text-primary">USD</div>
<div class="font-body-md text-body-md text-on-surface-variant">US Dollar</div>
</div>
</div>
<span class="material-symbols-outlined text-primary icon-fill" data-icon="check_circle">check_circle</span>
</button>
<!-- Inactive Items -->
<button class="flex items-center justify-between p-sm rounded-lg hover:bg-surface-container-low transition-colors duration-200 active:scale-95 group border border-transparent hover:border-outline-variant/30">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface font-title-lg text-title-lg">€</div>
<div class="text-left">
<div class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">EUR</div>
<div class="font-body-md text-body-md text-on-surface-variant">Euro</div>
</div>
</div>
</button>
<button class="flex items-center justify-between p-sm rounded-lg hover:bg-surface-container-low transition-colors duration-200 active:scale-95 group border border-transparent hover:border-outline-variant/30">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface font-title-lg text-title-lg">£</div>
<div class="text-left">
<div class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">GBP</div>
<div class="font-body-md text-body-md text-on-surface-variant">British Pound</div>
</div>
</div>
</button>
<button class="flex items-center justify-between p-sm rounded-lg hover:bg-surface-container-low transition-colors duration-200 active:scale-95 group border border-transparent hover:border-outline-variant/30">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface font-title-lg text-title-lg">ر.س</div>
<div class="text-left">
<div class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">SAR</div>
<div class="font-body-md text-body-md text-on-surface-variant">Saudi Riyal</div>
</div>
</div>
</button>
</div>
</section>
</main>
<!-- Navigation suppressed as this is a transactional/settings sub-page with a "Back" action -->
<script>
        // Simple input clear logic
        document.querySelector('input').addEventListener('input', function(e) {
            const clearBtn = this.nextElementSibling;
            if(this.value.length > 0) {
                clearBtn.classList.remove('hidden');
                clearBtn.classList.add('block');
            } else {
                clearBtn.classList.add('hidden');
                clearBtn.classList.remove('block');
            }
        });

        document.querySelector('input + button').addEventListener('click', function() {
            const input = this.previousElementSibling;
            input.value = '';
            input.focus();
            this.classList.add('hidden');
            this.classList.remove('block');
        });
    </script>
</body></html>
