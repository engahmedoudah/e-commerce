<script>
        // Micro-interaction: Subtle hover or tilt effect for the error illustration
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.relative.w-full.max-w-sm');
            if (!container) return;
            const rect = container.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            
            const badge = container.querySelector('div.absolute.top-1\/2');
            if (badge) {
                badge.style.transform = `translate(calc(-50% + ${x * 20}px), calc(-50% + ${y * 20}px))`;
            }
        });

        // Add haptic effect emulation on buttons
        document.querySelectorAll('.haptic-feedback').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
