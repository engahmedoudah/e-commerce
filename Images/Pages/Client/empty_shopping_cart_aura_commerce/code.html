<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Aura Commerce - Empty Cart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e0e3e5",
                        "surface-container-high": "#e6e8ea",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "on-background": "#191c1e",
                        "tertiary-container": "#0b1c30",
                        "primary-fixed": "#dde2f6",
                        "tertiary": "#000000",
                        "surface-dim": "#d8dadc",
                        "on-primary-fixed-variant": "#414756",
                        "secondary-fixed-dim": "#dac3aa",
                        "surface-container-low": "#f2f4f6",
                        "primary": "#000000",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#f7dec5",
                        "outline": "#76777d",
                        "on-primary-container": "#7e8395",
                        "outline-variant": "#c6c6cc",
                        "tertiary-fixed": "#d3e4fe",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "inverse-primary": "#c1c6d9",
                        "on-tertiary-fixed": "#0b1c30",
                        "surface-container": "#eceef0",
                        "on-surface-variant": "#45464c",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#151b29",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#544432",
                        "on-secondary-fixed": "#26190a",
                        "on-surface": "#191c1e",
                        "surface": "#f7f9fb",
                        "inverse-surface": "#2d3133",
                        "error": "#ba1a1a",
                        "surface-tint": "#585e6f",
                        "on-error-container": "#93000a",
                        "primary-container": "#151b29",
                        "surface-variant": "#e0e3e5",
                        "secondary-container": "#f7dec5",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary": "#6d5b48",
                        "primary-fixed-dim": "#c1c6d9",
                        "on-secondary-container": "#73614d",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary-fixed-variant": "#38485d",
                        "background": "#f7f9fb",
                        "on-tertiary-container": "#75859d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "20px",
                        "base": "8px",
                        "sm": "12px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "32px",
                        "md": "16px",
                        "gutter": "12px",
                        "safe-area": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "price-display": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "price-display": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-surface text-on-surface h-full flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface/90 dark:bg-surface-dim/90 backdrop-blur-xl docked full-width top-0 sticky border-b border-outline-variant/30 dark:border-outline/20 flat no shadows flex flex-col gap-xs pt-base pb-sm px-container-margin w-full max-w-full z-40 transition-all duration-300">
<div class="flex items-center justify-between h-14 w-full max-w-screen-md mx-auto">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors text-primary dark:text-primary-fixed-dim opacity-70 duration-200 focus:outline-none focus:ring-2 focus:ring-primary-container">
<span class="material-symbols-outlined text-2xl" data-icon="location_on">location_on</span>
</button>
<h1 class="font-display-lg text-headline-lg-mobile tracking-tighter text-primary dark:text-primary-fixed-dim truncate px-4">Aura Commerce</h1>
<button class="p-2 -mr-2 rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors text-primary dark:text-primary-fixed opacity-70 duration-200 focus:outline-none focus:ring-2 focus:ring-primary-container">
<span class="material-symbols-outlined text-2xl" data-icon="shopping_cart" data-weight="fill" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
</button>
</div>
</header>
<!-- Main Content: Empty Cart State -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-xl w-full max-w-screen-md mx-auto">
<div class="flex flex-col items-center text-center max-w-md w-full animate-fade-in-up">
<!-- Empty State Icon/Illustration -->
<div class="w-32 h-32 mb-lg bg-surface-container-lowest rounded-full flex items-center justify-center border border-outline-variant/20 shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined text-[80px] text-outline-variant/50" data-icon="shopping_bag">shopping_bag</span>
</div>
<!-- Headline -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm tracking-tight">Your cart is empty</h2>
<!-- Subtitle -->
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl px-4">
                Looks like you haven't added anything to your cart yet. Explore our collections to find something you love.
            </p>
<!-- CTA Button -->
<button class="w-full sm:w-auto bg-primary text-on-primary font-title-lg text-title-lg rounded-full py-4 px-8 hover:opacity-90 active:scale-[0.98] transition-all duration-200 shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary flex items-center justify-center gap-2">
                Start Shopping
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<!-- Secondary Link (Optional) -->
<button class="mt-md text-on-surface-variant font-label-md text-label-md hover:text-primary transition-colors underline-offset-4 hover:underline focus:outline-none rounded p-2">
                View Saved Items
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface/95 dark:bg-surface-dim/95 backdrop-blur-md docked full-width bottom-0 fixed z-50 rounded-t-xl border-t border-outline-variant/20 shadow-[0px_-4px_20px_rgba(0,0,0,0.04)] md:hidden">
<div class="flex justify-around items-center px-gutter py-sm pb-safe-area w-full max-w-screen-md mx-auto h-[80px]">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary transition-all active:scale-95 duration-150 group w-16 focus:outline-none rounded-lg p-1" href="#">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<!-- Search -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary transition-all active:scale-95 duration-150 group w-16 focus:outline-none rounded-lg p-1" href="#">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform" data-icon="search">search</span>
<span class="font-label-md text-label-md">Search</span>
</a>
<!-- Cart (Active) -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-bold active:scale-95 duration-150 group w-16 focus:outline-none rounded-lg p-1" href="#">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform" data-icon="shopping_bag" data-weight="fill" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
<span class="font-label-md text-label-md">Cart</span>
</a>
<!-- Orders -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary transition-all active:scale-95 duration-150 group w-16 focus:outline-none rounded-lg p-1" href="#">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform" data-icon="receipt_long">receipt_long</span>
<span class="font-label-md text-label-md">Orders</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary transition-all active:scale-95 duration-150 group w-16 focus:outline-none rounded-lg p-1" href="#">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</div>
</nav>
<!-- Spacer for fixed bottom nav on mobile -->
<div class="h-[80px] md:hidden w-full"></div>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
<script>
        // Simple haptic feedback simulation for buttons
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('click', () => {
                if (navigator.vibrate) {
                    navigator.vibrate(10); // Light tick
                }
            });
        });
    </script>
</body></html>
