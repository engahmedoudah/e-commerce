<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>LUXE | Product Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-low": "#f2f4f6",
                    "on-tertiary-fixed-variant": "#38485d",
                    "outline-variant": "#c6c6cc",
                    "on-tertiary-fixed": "#0b1c30",
                    "surface-bright": "#f7f9fb",
                    "tertiary-fixed-dim": "#b7c8e1",
                    "on-primary-fixed-variant": "#414756",
                    "inverse-surface": "#2d3133",
                    "inverse-on-surface": "#eff1f3",
                    "on-secondary": "#ffffff",
                    "secondary": "#6d5b48",
                    "inverse-primary": "#c1c6d9",
                    "surface-dim": "#d8dadc",
                    "error-container": "#ffdad6",
                    "tertiary-fixed": "#d3e4fe",
                    "primary": "#000000",
                    "on-surface": "#191c1e",
                    "on-secondary-fixed": "#26190a",
                    "on-secondary-fixed-variant": "#544432",
                    "secondary-fixed": "#f7dec5",
                    "background": "#f7f9fb",
                    "on-background": "#191c1e",
                    "tertiary": "#000000",
                    "surface-container-lowest": "#ffffff",
                    "surface-container": "#eceef0",
                    "primary-container": "#151b29",
                    "on-tertiary-container": "#75859d",
                    "surface-container-highest": "#e0e3e5",
                    "on-primary-container": "#7e8395",
                    "on-primary": "#ffffff",
                    "surface-container-high": "#e6e8ea",
                    "secondary-fixed-dim": "#dac3aa",
                    "error": "#ba1a1a",
                    "surface-tint": "#585e6f",
                    "surface": "#f7f9fb",
                    "on-surface-variant": "#45464c",
                    "on-secondary-container": "#73614d",
                    "tertiary-container": "#0b1c30",
                    "surface-variant": "#e0e3e5",
                    "secondary-container": "#f7dec5",
                    "primary-fixed": "#dde2f6",
                    "on-primary-fixed": "#151b29",
                    "on-error-container": "#93000a",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#c1c6d9",
                    "on-tertiary": "#ffffff",
                    "outline": "#76777d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "sm": "12px",
                    "base": "8px",
                    "container-margin": "20px",
                    "lg": "24px",
                    "xl": "32px",
                    "md": "16px",
                    "gutter": "12px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "title-lg": ["Inter"],
                    "price-display": ["Inter"]
            },
            "fontSize": {

                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],

                    "price-display": ["24px", {"lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700"}]

          },
        },
      }

<style>
        .shimmer {
            background: linear-gradient(90deg, #F1F5F9 0%, #E2E8F0 50%, #F1F5F9 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface/90 dark:bg-surface/90 flex justify-between items-center h-16 px-container-margin">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-primary dark:text-on-primary-fixed cursor-pointer">arrow_back</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight text-primary dark:text-on-primary-fixed">LUXE</h1>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary dark:text-on-primary-fixed cursor-pointer">search</span>
<span class="material-symbols-outlined text-primary dark:text-on-primary-fixed cursor-pointer">shopping_bag</span>
</div>
</header>
<main class="pt-16 pb-32">
<!-- Image Carousel Skeleton -->
<section class="relative w-full aspect-square md:aspect-[16/9] lg:aspect-[21/9] bg-surface-container overflow-hidden">
<div class="shimmer w-full h-full"></div>
<!-- Pagination Overlay Pill -->
<div class="absolute bottom-md right-container-margin bg-white/80 backdrop-blur px-md py-xs rounded-full shadow-sm">
<div class="shimmer w-10 h-4 rounded-sm"></div>
</div>
</section>
<!-- Product Content Canvas -->
<article class="px-container-margin mt-lg">
<!-- Header Section -->
<div class="flex flex-col gap-xs">
<div class="shimmer w-24 h-4 rounded-sm mb-xs"></div> <!-- Brand Label -->
<div class="shimmer w-full h-8 rounded-sm"></div> <!-- Title Line 1 -->
<div class="shimmer w-2/3 h-8 rounded-sm"></div> <!-- Title Line 2 -->
</div>
<!-- Price & Rating -->
<div class="flex justify-between items-end mt-lg">
<div class="flex flex-col gap-xs">
<div class="shimmer w-32 h-10 rounded-sm"></div> <!-- Price -->
<div class="shimmer w-48 h-4 rounded-sm"></div> <!-- Sub-price/Installments -->
</div>
<div class="shimmer w-20 h-6 rounded-sm"></div> <!-- Rating Badge -->
</div>
<!-- Selection Chips Skeleton (Sizes/Colors) -->
<div class="mt-xl">
<div class="shimmer w-32 h-4 rounded-sm mb-md"></div> <!-- Selection Label -->
<div class="flex gap-sm">
<div class="shimmer w-14 h-14 rounded-lg"></div>
<div class="shimmer w-14 h-14 rounded-lg"></div>
<div class="shimmer w-14 h-14 rounded-lg"></div>
<div class="shimmer w-14 h-14 rounded-lg"></div>
</div>
</div>
<!-- Description Section -->
<div class="mt-xl flex flex-col gap-md">
<div class="shimmer w-40 h-6 rounded-sm"></div> <!-- Section Title -->
<div class="space-y-sm">
<div class="shimmer w-full h-4 rounded-sm"></div>
<div class="shimmer w-full h-4 rounded-sm"></div>
<div class="shimmer w-full h-4 rounded-sm"></div>
<div class="shimmer w-4/5 h-4 rounded-sm"></div>
</div>
</div>
<!-- Accordion Items -->
<div class="mt-xl border-t border-outline-variant">
<div class="flex justify-between items-center py-lg border-b border-outline-variant">
<div class="shimmer w-48 h-5 rounded-sm"></div>
<div class="shimmer w-6 h-6 rounded-full"></div>
</div>
<div class="flex justify-between items-center py-lg border-b border-outline-variant">
<div class="shimmer w-36 h-5 rounded-sm"></div>
<div class="shimmer w-6 h-6 rounded-full"></div>
</div>
</div>
</article>
<!-- Recommended Bento Grid Skeleton -->
<section class="mt-xl px-container-margin">
<div class="shimmer w-56 h-6 rounded-sm mb-lg"></div>
<div class="grid grid-cols-2 gap-gutter">
<!-- Product Card 1 -->
<div class="flex flex-col gap-sm">
<div class="shimmer aspect-[4/5] w-full rounded-lg"></div>
<div class="shimmer w-3/4 h-4 rounded-sm"></div>
<div class="shimmer w-1/2 h-5 rounded-sm"></div>
</div>
<!-- Product Card 2 -->
<div class="flex flex-col gap-sm">
<div class="shimmer aspect-[4/5] w-full rounded-lg"></div>
<div class="shimmer w-3/4 h-4 rounded-sm"></div>
<div class="shimmer w-1/2 h-5 rounded-sm"></div>
</div>
</div>
</section>
</main>
<!-- Floating Action Bar (Mimics Add to Cart Area) -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md px-container-margin py-base pb-safe z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.04)]">
<div class="flex items-center gap-md h-16">
<div class="shimmer w-16 h-full rounded-lg"></div> <!-- Wishlist Action -->
<div class="shimmer flex-1 h-full rounded-lg"></div> <!-- Primary CTA -->
</div>
</footer>
<!-- Script to simulate loading completion (optional UI logic) -->
<script>
        // Smooth scroll to top on load
        window.scrollTo(0, 0);
        
        // Interaction simulation for skeleton
        document.querySelectorAll('.shimmer').forEach(el => {
            el.addEventListener('click', () => {
                console.log('Loading state interaction...');
            });
        });
    </script>
</body></html>
