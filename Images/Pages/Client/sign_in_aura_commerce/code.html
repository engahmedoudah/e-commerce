<style>

            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center overflow-x-hidden">

<!-- Main Content Canvas -->

<p class="font-body-md text-body-md text-on-surface-variant">Elevate your shopping experience</p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-md" id="signInForm" onsubmit="return handleSignIn(event)">

                        Email Address
                    </label>
</div>
</div>
<!-- Password Input Group -->
<div class="relative flex flex-col group">
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline">lock</span>
<input class="w-full h-14 pl-[52px] pr-[52px] bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg focus:ring-2 focus:ring-primary/10 transition-all peer outline-none" id="password" name="password" placeholder=" " required="" type="password">

                        Password
                    </label>
<button class="absolute right-md text-outline hover:text-primary transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-xs">
<a class="font-label-md text-label-md text-primary hover:underline decoration-1 underline-offset-4" href="#">Forgot Password?</a>
</div>
</div>
<!-- Error Message Area -->
<div class="hidden flex items-center gap-xs p-base bg-error-container/30 border border-error/20 rounded-lg text-error" id="errorArea">

<script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const pwdIcon = document.getElementById('passwordIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdIcon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                pwdIcon.textContent = 'visibility';
            }
        }

        function handleSignIn(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorArea = document.getElementById('errorArea');
            const form = document.getElementById('signInForm');
            const originalText = btn.innerHTML;

            // Simple demo logic: Any input with "error" triggers validation fail
            const emailValue = document.getElementById('email').value;

            // UI State: Loading
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            `;
            btn.disabled = true;

            setTimeout(() => {
                if (emailValue.includes('error')) {
                    // Show Error State
                    errorArea.classList.remove('hidden');
                    form.classList.add('error-shake');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    
                    setTimeout(() => {
                        form.classList.remove('error-shake');
                    }, 500);
                } else {
                    // Success Simulation
                    btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span>`;
                    btn.classList.replace('bg-primary', 'bg-secondary');
                    setTimeout(() => {
                        alert('Sign in successful (Demo)');
                        btn.innerHTML = originalText;
                        btn.classList.replace('bg-secondary', 'bg-primary');
                        btn.disabled = false;
                        errorArea.classList.add('hidden');
                    }, 1000);
                }
            }, 1200);

            return false;
        }
    </script>
