<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Logout Confirmation - Aura Commerce</title>

                    },
                    "borderRadius": {

                    },
                    "spacing": {

                    },
                    "fontFamily": {

                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }]

                }
            }
        }

<style>
        .scrim {
            background-color: rgba(25, 28, 30, 0.4); /* on-background with 40% opacity */
            backdrop-filter: blur(4px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full bg-background font-body-md text-on-background antialiased relative">
<!-- Background Content (Profile screen context, blurred/dimmed by scrim) -->
<div aria-hidden="true" class="h-full w-full flex flex-col absolute inset-0 z-0 select-none pointer-events-none">
<!-- TopAppBar Placeholder (Hidden by instructions due to transactional nature, but visible behind modal) -->
<header class="flex justify-between items-center h-16 px-container-margin w-full bg-surface/90">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
<h1 class="font-title-lg text-title-lg text-on-surface tracking-tight">Profile</h1>
<span class="material-symbols-outlined text-on-surface">settings</span>
</header>
<main class="flex-1 px-container-margin py-lg space-y-lg opacity-50">
<div class="flex items-center space-x-md">
<div class="w-16 h-16 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-3xl text-on-surface-variant">person</span>
</div>
<div>
<h2 class="font-title-lg text-title-lg text-on-surface">Jane Doe</h2>
<p class="font-body-md text-body-md text-on-surface-variant">jane.doe@example.com</p>
</div>
</div>
<div class="space-y-sm">
<div class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant/20 flex justify-between items-center">
<span class="font-body-lg text-body-lg text-on-surface">Order History</span>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
<div class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant/20 flex justify-between items-center">
<span class="font-body-lg text-body-lg text-on-surface">Payment Methods</span>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
<div class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant/20 flex justify-between items-center">
<span class="font-body-lg text-body-lg text-on-surface">Shipping Addresses</span>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</div>
</main>
</div>
<!-- Scrim / Modal Overlay -->
<div aria-labelledby="modal-title" aria-modal="true" class="fixed inset-0 z-50 flex items-center justify-center px-container-margin scrim transition-opacity duration-300" role="dialog">
<!-- Modal Dialog -->
<div class="bg-surface-container-lowest w-full max-w-sm rounded-xl p-lg shadow-[0px_10px_40px_rgba(0,0,0,0.08)] transform transition-transform duration-300 scale-100 flex flex-col items-center text-center">
<!-- Icon -->
<div class="w-16 h-16 rounded-full bg-surface-variant/50 flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">logout</span>
</div>
<!-- Content -->
<h2 class="font-title-lg text-title-lg text-on-surface mb-sm" id="modal-title">Log Out</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">
                Are you sure you want to log out of your Aura Commerce account?
            </p>
<!-- Actions -->
<div class="w-full space-y-sm">
<button class="w-full py-sm bg-primary text-on-primary font-body-lg text-body-lg rounded-full haptic-feedback hover:opacity-90 active:scale-95 transition-all duration-200" type="button">
                    Log Out
                </button>
<button class="w-full py-sm bg-transparent border border-outline text-on-surface font-body-lg text-body-lg rounded-full hover:bg-surface-variant/30 active:scale-95 transition-all duration-200" type="button">
                    Cancel
                </button>
</div>
</div>
</div>
<script>
        // Simple haptic feedback simulation
        document.querySelectorAll('.haptic-feedback').forEach(button => {
            button.addEventListener('click', () => {
                if (navigator.vibrate) {
                    navigator.vibrate(10); // Light tick
                }
            });
        });
    </script>
</body></html>
