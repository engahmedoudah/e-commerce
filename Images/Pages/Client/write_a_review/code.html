<style>
        .star-rating .material-symbols-outlined {
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .star-rating .material-symbols-outlined:hover {
            transform: scale(1.1);
        }
        .star-rating .material-symbols-outlined.active {
            font-variation-settings: 'FILL' 1;
            color: #191c1e;
        }
        
        .upload-zone {
            border: 1px dashed #76777d;
            transition: all 0.3s ease;
        }
        .upload-zone:hover {
            border-color: #191c1e;
            background-color: rgba(0,0,0,0.02);
        }
        
        /* Custom Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #000000;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #000000;
        }
    </style>

<body class="bg-surface text-on-surface antialiased">
<!-- Top Navigation (Transactional context - Close action implies temporary departure, but user requested standard components, however JSON says TopAppBar is a shared component, we will implement it for the transactional view with a close button instead of menu) -->
<header class="fixed top-0 w-full z-50 bg-surface/90 dark:bg-surface/90 backdrop-blur-md flex justify-between items-center px-container-margin py-sm">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">close</span>
</button>
<div class="font-display-lg text-title-lg tracking-tighter text-primary dark:text-primary-fixed">
            AURA
        </div>
<div class="w-6"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="pt-[80px] pb-[120px] px-container-margin max-w-lg mx-auto">
<!-- Header -->
<div class="mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Rate your experience</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We'd love to hear your thoughts on the Minimalist Concrete Vase.</p>
</div>
<!-- Product Context Snippet (Optional but good UX) -->
<div class="flex items-center gap-md mb-xl p-md rounded-lg border border-outline-variant/30 bg-surface-container-lowest">
<img alt="Product Image" class="w-16 h-16 object-cover rounded-DEFAULT bg-surface-container-low" data-alt="A small, high-quality product image of a minimalist, cylindrical concrete vase sitting on a clear glass table. Soft, natural daylight highlights the textured, raw concrete surface against a bright, airy background. Premium editorial photography style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_ycG5VjBGm6aa4V0VXzh8gLgaycsFzxtpQ2Yb_VC96XZOJ9OSGJou2KOaf9vMMARL0keapgdlkCAs2TXB9HCeKZRKtzcDRClGWQzrgztVWhoNMXac0BMtzmNEofQpj1TmqTRkkAJgLdCYo75-MFzsIgVTV_dEFwgTn_B7n7VPFBCDqN1vXTFz5NR503sWSacYnvyNgN1RWolzmudSi7ipejruk24eWKY07cDYIMjPZFRttZ38ipP_ZQ">
<div>
<h3 class="font-title-lg text-body-lg">Minimalist Concrete Vase</h3>
<p class="font-body-md text-label-md text-on-surface-variant">Purchased 2 days ago</p>
</div>
</div>
<form class="space-y-xl" id="reviewForm">
<!-- Step 1: Star Rating -->
<section class="space-y-sm">
<label class="font-title-lg text-title-lg block">Overall Rating</label>
<div class="flex gap-xs star-rating text-outline-variant" id="starContainer">
<span class="material-symbols-outlined" data-value="1">star</span>
<span class="material-symbols-outlined" data-value="2">star</span>
<span class="material-symbols-outlined" data-value="3">star</span>
<span class="material-symbols-outlined" data-value="4">star</span>
<span class="material-symbols-outlined" data-value="5">star</span>
</div>
<input id="ratingValue" name="rating" type="hidden" value="0">
</section>
<!-- Step 2: Photo Upload -->
<section class="space-y-sm">
<label class="font-title-lg text-title-lg block">Add Photos <span class="font-body-md text-body-md text-on-surface-variant font-normal">(Optional)</span></label>
<div class="upload-zone rounded-lg p-lg flex flex-col items-center justify-center cursor-pointer bg-surface-container-lowest">
<span class="material-symbols-outlined text-outline mb-xs" style="font-size: 28px;">add_a_photo</span>
<span class="font-label-md text-label-md text-on-surface-variant">Tap to upload images</span>
</div>
<!-- Preview area for uploaded photos would go here -->
</section>
<!-- Step 3: Text Feedback -->
<section class="space-y-sm">
<label class="font-title-lg text-title-lg block">Your Review</label>
<textarea class="w-full bg-[#F1F5F9] border-none rounded-lg p-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0 focus:outline-none focus:border focus:border-on-surface focus:shadow-[0_0_0_4px_rgba(25,28,30,0.1)] resize-none transition-all" placeholder="What did you like or dislike? How did it fit?" rows="5"></textarea>
</section>
<!-- Step 4: Anonymous Toggle -->
<section class="flex items-center justify-between py-sm border-t border-outline-variant/30">
<div>
<h4 class="font-body-lg text-body-lg text-on-surface">Post Anonymously</h4>
<p class="font-body-md text-label-md text-on-surface-variant">Hide your name on public reviews.</p>
</div>
<!-- Toggle -->
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out border-outline-variant z-10 top-0 left-0" id="toggle" name="toggle" style="margin: 0; outline: none;" type="checkbox">
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container-highest cursor-pointer transition-colors duration-200 ease-in-out" for="toggle"></label>
</div>
</section>
</form>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-md px-container-margin py-lg border-t border-outline-variant/20 z-50">
<button class="w-full bg-primary text-on-primary font-title-lg text-body-lg py-md rounded-lg active:scale-95 transition-transform duration-200 flex justify-center items-center" id="submitReview" type="button">
            Submit Review
        </button>
</div>
<script>
        // Star Rating Logic
        const stars = document.querySelectorAll('#starContainer .material-symbols-outlined');
        const ratingInput = document.getElementById('ratingValue');

        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                const value = parseInt(e.target.getAttribute('data-value'));
                ratingInput.value = value;
                
                // Add haptic feedback simulation
                if (navigator.vibrate) navigator.vibrate(10);
                
                updateStars(value);
            });
        });

        function updateStars(value) {
            stars.forEach((s, index) => {
                if (index < value) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });
        }

        // Toggle Switch custom logic for Tailwind positioning
        const toggleInput = document.getElementById('toggle');
        toggleInput.addEventListener('change', function() {
            if(this.checked) {
                this.style.transform = 'translateX(100%)';
            } else {
                this.style.transform = 'translateX(0)';
            }
        });
        
        // Setup initial toggle state
        if(toggleInput.checked) {
             toggleInput.style.transform = 'translateX(100%)';
        }

        // Button Loading State Simulation
        const submitBtn = document.getElementById('submitReview');
        submitBtn.addEventListener('click', () => {
            // Check if rating is provided
            if(ratingInput.value === "0") {
                alert("Please provide a rating first.");
                return;
            }
            
            // Haptic
            if (navigator.vibrate) navigator.vibrate([15, 30, 15]);

            const originalText = submitBtn.innerText;
            const currentWidth = submitBtn.offsetWidth;
            
            // Lock width to prevent layout shift
            submitBtn.style.width = `${currentWidth}px`;
            submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin" style="font-size: 20px;">progress_activity</span>`;
            
            setTimeout(() => {
                submitBtn.innerHTML = 'Review Submitted';
                submitBtn.style.backgroundColor = '#6d5b48'; // secondary color
                setTimeout(() => {
                    // Reset (in reality, would redirect)
                    submitBtn.innerHTML = originalText;
                    submitBtn.style.backgroundColor = '';
                    submitBtn.style.width = '100%';
                }, 2000);
            }, 1500);
        });
    </script>
</body></html>
