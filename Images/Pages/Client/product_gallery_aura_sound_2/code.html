<script>
        document.addEventListener('DOMContentLoaded', () => {
            const heroContainer = document.getElementById('hero-image-container');
            const heroImage = document.getElementById('hero-image');
            const zoomHint = document.getElementById('zoom-hint');
            let isZoomed = false;

            // Simple zoom interaction
            heroContainer.addEventListener('dblclick', () => {
                isZoomed = !isZoomed;
                if (isZoomed) {
                    heroContainer.style.transform = 'scale(2)';
                    heroContainer.style.cursor = 'grab';
                } else {
                    heroContainer.style.transform = 'scale(1)';
                    heroContainer.style.cursor = 'crosshair';
                }
            });

            // Show zoom hint on initial load briefly
            setTimeout(() => {
                zoomHint.classList.remove('opacity-0');
                setTimeout(() => {
                    zoomHint.classList.add('opacity-0');
                }, 2500);
            }, 1000);

            // Thumbnail selection logic
            const thumbnails = document.querySelectorAll('footer button');
            const counter = document.getElementById('pagination-counter');
            
            thumbnails.forEach(thumb => {
                thumb.addEventListener('click', () => {
                    // Reset all
                    thumbnails.forEach(t => {
                        t.className = 'relative w-16 h-16 md:w-20 md:h-20 rounded-lg overflow-hidden bg-surface-container transition-all border-2 border-transparent hover:border-outline-variant/50 opacity-60 hover:opacity-100';
                    });
                    
                    // Set active
                    thumb.className = 'relative w-16 h-16 md:w-20 md:h-20 rounded-lg overflow-hidden bg-surface-container transition-all border-2 border-primary ring-2 ring-primary/20 ring-offset-2 ring-offset-surface-container-lowest';
                    
                    // Update counter
                    const index = thumb.getAttribute('data-index');
                    counter.textContent = `${index} / 5`;
                    
                    // Simulated image change effect
                    heroImage.style.opacity = '0';
                    setTimeout(() => {
                        // In a real app, update src here
                        heroImage.style.opacity = '1';
                        // Reset zoom if active
                        if(isZoomed) {
                            isZoomed = false;
                            heroContainer.style.transform = 'scale(1)';
                            heroContainer.style.cursor = 'crosshair';
                        }
                    }, 300);
                });
            });
        });
    </script>
