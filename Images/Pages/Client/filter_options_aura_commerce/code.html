<style>

        /* Custom Range Slider Styling for WebKit */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {

            height: 4px;

<!-- Inline script for simple interactions -->
<script>
        // Simulate toggle switch interaction
        const toggleBtn = document.querySelector('button[role="switch"]');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                const isChecked = this.getAttribute('aria-checked') === 'true';
                this.setAttribute('aria-checked', !isChecked);
                
                const thumb = this.querySelector('span');
                if (!isChecked) {
                    this.classList.remove('bg-surface-container-highest');
                    this.classList.add('bg-primary');
                    thumb.classList.remove('translate-x-0', 'bg-on-surface-variant');
                    thumb.classList.add('translate-x-6', 'bg-on-primary');
                } else {
                    this.classList.add('bg-surface-container-highest');
                    this.classList.remove('bg-primary');
                    thumb.classList.add('translate-x-0', 'bg-on-surface-variant');
                    thumb.classList.remove('translate-x-6', 'bg-on-primary');
                }
                
                // Trigger haptic feedback visually
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 100);
            });
        }

        // Chip selection interaction
        const chips = document.querySelectorAll('section:nth-of-type(1) button');
        chips.forEach(chip => {
            chip.addEventListener('click', function() {
                // Remove active state from all
                chips.forEach(c => {
                    c.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                    c.classList.add('bg-transparent', 'text-on-surface-variant', 'border-outline-variant');
                });
                // Add active state to clicked
                this.classList.remove('bg-transparent', 'text-on-surface-variant', 'border-outline-variant');
                this.classList.add('bg-primary', 'text-on-primary', 'border-primary');
            });
        });
    </script>
