<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Add New Address - Aura Commerce</title>

                    "inverse-surface": "#2d3133",
                    "surface-dim": "#d8dadc",
                    "on-secondary-container": "#73614d",
                    "secondary": "#6d5b48",
                    "tertiary-container": "#0b1c30",
                    "surface-container-highest": "#e0e3e5",
                    "secondary-container": "#f7dec5",
                    "on-tertiary-fixed": "#0b1c30",
                    "error-container": "#ffdad6",
                    "primary-fixed-dim": "#c1c6d9",
                    "on-secondary-fixed-variant": "#544432",
                    "surface-variant": "#e0e3e5",
                    "on-surface": "#191c1e",
                    "secondary-fixed": "#f7dec5",
                    "on-surface-variant": "#45464c",
                    "primary-container": "#151b29",
                    "outline-variant": "#c6c6cc",
                    "on-tertiary-fixed-variant": "#38485d",
                    "on-secondary-fixed": "#26190a",
                    "on-tertiary": "#ffffff",
                    "surface-container-high": "#e6e8ea",
                    "secondary-fixed-dim": "#dac3aa",
                    "tertiary": "#000000",
                    "surface-container": "#eceef0",
                    "on-primary": "#ffffff",
                    "tertiary-fixed": "#d3e4fe",
                    "on-error-container": "#93000a",
                    "surface-bright": "#f7f9fb",
                    "primary": "#000000",
                    "inverse-on-surface": "#eff1f3",
                    "background": "#f7f9fb",
                    "on-tertiary-container": "#75859d",
                    "error": "#ba1a1a",
                    "on-primary-fixed-variant": "#414756",
                    "inverse-primary": "#c1c6d9",
                    "outline": "#76777d",
                    "on-error": "#ffffff",
                    "on-secondary": "#ffffff",
                    "on-primary-container": "#7e8395",
                    "surface-container-low": "#f2f4f6"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-margin": "20px",
                    "lg": "24px",
                    "gutter": "12px",
                    "base": "8px",
                    "xs": "4px",
                    "sm": "12px",
                    "md": "16px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "title-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "label-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "price-display": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "600"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "price-display": ["24px", {"lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .custom-shadow-low { box-shadow: 0px 4px 20px rgba(0,0,0,0.04); }
        .custom-shadow-high { box-shadow: 0px 10px 40px rgba(0,0,0,0.08); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .map-pin-bounce {
            animation: bounce-pin 1.2s ease-in-out infinite;
        }
        @keyframes bounce-pin {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface selection:bg-primary-fixed">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface/90 flex items-center justify-between px-container-margin h-16 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-200 text-primary p-1">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg font-bold tracking-tight text-primary">Add Address</h1>
</div>
<div class="w-6"></div> <!-- Spacer for symmetry -->
</header>
<main class="pt-16 pb-32">
<!-- Interactive Map Section -->
<section class="relative h-[397px] w-full overflow-hidden bg-surface-container">
<div class="absolute inset-0 w-full h-full grayscale-[0.2] contrast-[1.1]" data-alt="A high-end minimalist digital map of a modern urban neighborhood in New York City. The map features clean white streets, subtle light grey buildings, and soft charcoal outlines. The aesthetic is professional and premium, following a light-mode color palette with high-contrast elements. The lighting is bright and even, evoking a sense of clarity and modern luxury." data-location="New York City" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB56EWenF1gSrmsEVSa0zP2slp4oc6FJGcgPQQdp285phNiiduP3W6QcRYLwkY1jdW5AjCoLf-xjJf32FYqj8NUgh-1UFiJQ0kp0cnQrruuy0Mm9VsUPHtjqMWrziPd1to6-c7rSM2L-7uyBPUgyO9xGBi9bDKLIOLnzOhRMsIDX9f5zPuGHyqc7Zg4DW_rfDnlYRcwRkgeoliQEsqZcTIScSz3LI_QnIGWF7NmxK5tii_I78-9c4a-hQ')">
</div>
<!-- Central Pin Indicator -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-4xl map-pin-bounce" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="w-2 h-1 bg-black/20 rounded-full blur-[2px] mt-[-4px]"></div>
</div>
</div>
<!-- Current Location Button Overlay -->
<button class="absolute bottom-6 right-container-margin bg-surface-container-lowest p-3 rounded-full custom-shadow-high active:scale-90 transition-transform duration-200 text-primary">
<span class="material-symbols-outlined">my_location</span>
</button>
</section>
<!-- Address Form Container -->
<section class="relative -mt-6 bg-surface-container-lowest rounded-t-[32px] px-container-margin pt-8 pb-12 custom-shadow-high">
<!-- Pull Indicator -->
<div class="absolute top-3 left-1/2 -translate-x-1/2 w-10 h-1 bg-outline-variant/30 rounded-full"></div>
<div class="space-y-lg">
<!-- Address Search -->
<div class="relative">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">
<span class="material-symbols-outlined">search</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-xl font-body-md focus:ring-2 focus:ring-primary/10 transition-all placeholder:text-on-surface-variant/60" placeholder="Search for area, street name..." type="text">
</div>
<!-- Manual Entry Fields -->
<div class="grid grid-cols-1 gap-md">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider px-1">Flat / House No / Apartment</label>
<input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-xl font-body-md focus:ring-2 focus:ring-primary/10 transition-all" placeholder="e.g. 402, Aura Heights" type="text">
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider px-1">Street Name / Area</label>
<input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-xl font-body-md focus:ring-2 focus:ring-primary/10 transition-all" placeholder="e.g. 5th Avenue, Midtown" type="text">
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider px-1">Landmark (Optional)</label>
<input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-xl font-body-md focus:ring-2 focus:ring-primary/10 transition-all" placeholder="e.g. Near Central Park" type="text">
</div>
</div>
<!-- Label Selection Chips -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider px-1">Save Address As</label>
<div class="flex gap-sm">
<button class="chip-btn active h-10 px-6 rounded-full border border-primary bg-primary text-on-primary font-label-md flex items-center justify-center transition-all duration-200" onclick="toggleChip(this)">
                            Home
                        </button>
<button class="chip-btn h-10 px-6 rounded-full border border-outline-variant bg-transparent text-on-surface font-label-md flex items-center justify-center transition-all duration-200" onclick="toggleChip(this)">
                            Office
                        </button>
<button class="chip-btn h-10 px-6 rounded-full border border-outline-variant bg-transparent text-on-surface font-label-md flex items-center justify-center transition-all duration-200" onclick="toggleChip(this)">
                            Other
                        </button>
</div>
</div>
<!-- Default Toggle -->
<div class="flex items-center justify-between py-2">
<div class="flex flex-col">
<span class="font-body-lg text-on-surface font-semibold">Set as Default Address</span>
<span class="font-body-md text-on-surface-variant">Use this for all future deliveries</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value="">
<div class="w-11 h-6 bg-outline-variant/30 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</section>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full p-container-margin bg-surface-container-lowest/80 backdrop-blur-xl border-t border-outline-variant/10 z-50">
<button class="w-full h-16 bg-primary text-on-primary rounded-xl font-title-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-200 shadow-xl shadow-primary/10" id="save-btn">
<span>Save Address</span>
<span class="hidden animate-spin h-5 w-5 border-2 border-on-primary border-t-transparent rounded-full" id="loader"></span>
</button>
</div>
<script>
        function toggleChip(selected) {
            document.querySelectorAll('.chip-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-on-primary', 'border-primary', 'active');
                btn.classList.add('bg-transparent', 'text-on-surface', 'border-outline-variant');
            });
            selected.classList.add('bg-primary', 'text-on-primary', 'border-primary', 'active');
            selected.classList.remove('bg-transparent', 'text-on-surface', 'border-outline-variant');
        }

        const saveBtn = document.getElementById('save-btn');
        const loader = document.getElementById('loader');

        saveBtn.addEventListener('click', () => {
            const btnText = saveBtn.querySelector('span:first-child');
            btnText.style.opacity = '0';
            loader.classList.remove('hidden');
            
            // Haptic simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(15);
            }

            setTimeout(() => {
                btnText.style.opacity = '1';
                btnText.textContent = 'Address Saved';
                loader.classList.add('hidden');
                saveBtn.classList.replace('bg-primary', 'bg-secondary');
                
                if (window.navigator.vibrate) {
                    window.navigator.vibrate([10, 30, 10]);
                }
            }, 1500);
        });

        // Simple scroll parallax/reveal for the form
        window.addEventListener('scroll', () => {
            const map = document.querySelector('section:first-of-type');
            const scroll = window.scrollY;
            map.style.transform = `translateY(${scroll * 0.4}px)`;
            map.style.opacity = 1 - (scroll / 400);
        });
    </script>
</body></html>
