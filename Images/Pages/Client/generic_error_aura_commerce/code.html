<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "secondary-fixed-dim": "#dac3aa",
                        "on-secondary-fixed-variant": "#544432",
                        "surface-container-high": "#e6e8ea",
                        "surface-dim": "#d8dadc",
                        "tertiary": "#000000",
                        "on-error-container": "#93000a",
                        "surface-container": "#eceef0",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#f7dec5",

                        "surface": "#f7f9fb",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "on-secondary-fixed": "#26190a",

                        "primary-fixed-dim": "#c1c6d9",
                        "surface-tint": "#585e6f",

                    "borderRadius": {

                    "spacing": {

                        "gutter": "12px",
                        "xl": "32px",
                        "lg": "24px",
                        "sm": "12px",
                        "xs": "4px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "price-display": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "price-display": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

                },
            },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-body-md text-on-background selection:bg-primary selection:text-on-primary antialiased">
<!-- TopAppBar (Destination check: Linear/Error flow -> Suppressed, but included as per JSON if it were a persistent error, however instructions say "Automatic Suppression: You MUST exclude the navigation shell if the page intent is... Error 404". Therefore, suppressing TopAppBar and BottomNavBar to prioritize the content canvas for this error screen.) -->
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-xl relative overflow-hidden">
<!-- Abstract Background Element for subtle premium feel -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-50 flex items-center justify-center">
<div class="w-96 h-96 rounded-full bg-surface-container-high blur-[100px]"></div>
</div>
<div class="relative z-10 flex flex-col items-center text-center max-w-md w-full">
<!-- Icon/Illustration Container -->
<div class="mb-lg flex items-center justify-center w-32 h-32 rounded-full bg-surface-container-low border border-surface-variant">
<span class="material-symbols-outlined text-[64px] text-outline" style="font-variation-settings: 'FILL' 0, 'wght' 200;">
                    broken_image
                </span>
</div>
<!-- Error Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-sm">
                Something went wrong
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl px-4">
                We're having trouble loading this page. Our team has been notified. Please try again.
            </p>
<!-- Actions -->
<div class="flex flex-col w-full gap-sm sm:flex-row sm:justify-center">
<button class="w-full sm:w-auto h-12 px-xl bg-primary text-on-primary rounded-DEFAULT font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-inverse-surface transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                    Retry
                </button>
<button class="w-full sm:w-auto h-12 px-xl bg-surface text-primary border border-outline-variant rounded-DEFAULT font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[18px]">storefront</span>
                    Return to Shop
                </button>
</div>
<!-- Technical Detail (Optional collapsable for premium feel) -->
<div class="mt-xl pt-lg border-t border-surface-variant w-full">
<p class="font-label-md text-label-md text-outline">
                    Error Code: 500_INTERNAL
                </p>
</div>
</div>
</main>
</body></html>
