<style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .haptic-feedback:active { transform: scale(0.98); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface/90 flex items-center justify-between px-container-margin h-16 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-200 hover:opacity-80 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary tracking-tight">Edit Address</h1>
</div>
<button class="active:scale-95 transition-transform duration-200 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-error">delete</span>
</button>
</header>
<main class="mt-16 mb-24 flex-1 overflow-y-auto px-container-margin py-lg space-y-lg">
<!-- Map Preview Section -->
<section class="relative h-48 w-full rounded-xl overflow-hidden shadow-sm border border-outline-variant/30 group">
<div class="w-full h-full bg-cover bg-center" data-alt="A clean, minimalist vector-style map of a Chicago residential neighborhood. The map features elegant muted grey streets, soft white blocks, and a single prominent black location pin with a subtle glow. The lighting is bright and architectural, reflecting a high-end light-mode e-commerce aesthetic with minimal clutter and professional cartography styling." data-location="Chicago, Illinois" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDsh7KKbQka5Rx8LJmYUXzPz-Z_m53MH79ySWXs4Y4CmmZ7QQE5uldE6MngT6UfyhiF3nPuVaYETDMTiOXR1G0boImkTdW8frdgS1wr-inpjmwDulOm4NFGMdvFEMUO_bUxSFijZHsVQ2T4Z1cgrFrgEG0gsYB4uCgOOHRWXOUmz5_c1rvayRo1TgXEy5JGeaf33FMV94ywI47rHyxHp7aCGaFKJ0ny4CC4BEL7cMhjhCAOK0fYaAHk2g')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent pointer-events-none"></div>
<button class="absolute bottom-4 right-4 bg-surface-container-lowest text-primary px-sm py-2 rounded-full font-label-md text-label-md flex items-center gap-base shadow-lg haptic-feedback">
<span class="material-symbols-outlined text-[18px]">open_in_new</span>
<span>Enlarge Map</span>
</button>
</section>
<!-- Form Section -->
<form class="space-y-xl">
<!-- Contact Info Group -->
<div class="space-y-sm">
<p class="font-label-md text-label-md text-on-surface-variant/80 uppercase tracking-widest px-xs">Contact Information</p>
<div class="space-y-md">
<div class="relative group">
<label class="absolute -top-2 left-3 px-1 bg-surface text-[10px] font-semibold text-primary uppercase tracking-tighter z-10">Full Name</label>
<input class="w-full h-14 px-4 rounded-lg bg-surface-container-low border-none focus:ring-1.5 focus:ring-primary font-body-lg text-body-lg text-on-surface transition-all duration-200" placeholder="e.g. John Doe" type="text" value="Julian Alexander">
</div>
<div class="relative group">
<label class="absolute -top-2 left-3 px-1 bg-surface text-[10px] font-semibold text-on-surface-variant uppercase tracking-tighter z-10">Phone Number</label>
<div class="flex items-center w-full h-14 rounded-lg bg-surface-container-low overflow-hidden">
<span class="pl-4 font-body-lg text-on-surface-variant pr-2 border-r border-outline-variant/30">+1</span>
<input class="flex-1 h-full px-4 border-none bg-transparent focus:ring-0 font-body-lg text-body-lg text-on-surface" placeholder="Phone number" type="tel" value="(312) 555-0192">
</div>
</div>
</div>
</div>
<!-- Address Info Group -->
<div class="space-y-sm">
<p class="font-label-md text-label-md text-on-surface-variant/80 uppercase tracking-widest px-xs">Location Details</p>
<div class="grid grid-cols-1 gap-md">
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-surface text-[10px] font-semibold text-on-surface-variant uppercase tracking-tighter z-10">Street Address</label>
<input class="w-full h-14 px-4 rounded-lg bg-surface-container-low border-none focus:ring-1.5 focus:ring-primary font-body-lg text-body-lg text-on-surface" placeholder="Enter street address" type="text" value="442 West Ontario Street">
</div>
<div class="grid grid-cols-2 gap-md">
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-surface text-[10px] font-semibold text-on-surface-variant uppercase tracking-tighter z-10">Apt / Suite</label>
<input class="w-full h-14 px-4 rounded-lg bg-surface-container-low border-none focus:ring-1.5 focus:ring-primary font-body-lg text-body-lg text-on-surface" placeholder="Optional" type="text" value="Unit 402">
</div>
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-surface text-[10px] font-semibold text-on-surface-variant uppercase tracking-tighter z-10">ZIP Code</label>
<input class="w-full h-14 px-4 rounded-lg bg-surface-container-low border-none focus:ring-1.5 focus:ring-primary font-body-lg text-body-lg text-on-surface" placeholder="ZIP" type="text" value="60654">
</div>
</div>
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-surface text-[10px] font-semibold text-on-surface-variant uppercase tracking-tighter z-10">City &amp; State</label>
<input class="w-full h-14 px-4 rounded-lg bg-surface-container-low border-none focus:ring-1.5 focus:ring-primary font-body-lg text-body-lg text-on-surface" placeholder="City, State" type="text" value="Chicago, IL">
</div>
</div>
</div>
<!-- Labels / Chips -->
<div class="space-y-sm">
<p class="font-label-md text-label-md text-on-surface-variant/80 uppercase tracking-widest px-xs">Label As</p>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-2.5 rounded-full border border-primary bg-primary text-on-primary font-label-md text-label-md haptic-feedback transition-colors duration-200" type="button">
                        Home
                    </button>
<button class="px-md py-2.5 rounded-full border border-outline text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors duration-200 haptic-feedback" type="button">
                        Office
                    </button>
<button class="px-md py-2.5 rounded-full border border-outline text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors duration-200 haptic-feedback" type="button">
                        Other
                    </button>
<button class="p-2.5 rounded-full border border-outline text-on-surface-variant flex items-center justify-center hover:bg-surface-container transition-colors duration-200 haptic-feedback" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
<!-- Default Address Toggle -->
<div class="flex items-center justify-between p-md bg-surface-container-low rounded-xl border border-outline-variant/10">
<div>
<h3 class="font-title-lg text-body-lg font-semibold">Set as default address</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Use this for all future purchases</p>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox">
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
</div>
</form>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-container-margin bg-surface/90 backdrop-blur-md z-50">
<button class="w-full bg-primary text-on-primary h-14 rounded-lg font-title-lg text-body-lg font-bold shadow-lg active:scale-95 transition-transform duration-200 hover:opacity-90">
            Update Address
        </button>
</div>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Label chip toggle logic
        const chips = document.querySelectorAll('button[type="button"]');
        chips.forEach(chip => {
            if (chip.textContent.trim() === 'Home' || chip.textContent.trim() === 'Office' || chip.textContent.trim() === 'Other') {
                chip.addEventListener('click', () => {
                    chips.forEach(c => {
                        c.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                        c.classList.add('border-outline', 'text-on-surface-variant');
                    });
                    chip.classList.remove('border-outline', 'text-on-surface-variant');
                    chip.classList.add('bg-primary', 'text-on-primary', 'border-primary');
                });
            }
        });
    </script>
</body></html>
