<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
            overscroll-behavior-y: contain;
        }
        .shimmer {
            background: linear-gradient(90deg, #F1F5F9 0%, #E2E8F0 50%, #F1F5F9 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .haptic-feedback:active {
            transform: scale(0.97);
            transition: transform 0.1s ease-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="flex flex-col min-h-screen text-on-surface select-none">
<!-- Top AppBar (Identity Only, No Nav for Onboarding) -->
<header class="sticky top-0 z-50 w-full flex flex-col gap-xs pt-base pb-sm px-container-margin bg-surface/90 backdrop-blur-xl">
<div class="flex items-center justify-between">
<span class="font-display-lg text-headline-lg-mobile tracking-tighter text-primary">Aura</span>
<button class="font-label-md text-label-md text-on-surface-variant haptic-feedback hover:text-primary transition-colors">
                Skip
            </button>
</div>
</header>
<main class="flex-grow flex flex-col items-center">
<!-- Hero Product Canvas -->
<section class="relative w-full px-container-margin pt-lg overflow-hidden flex justify-center items-center h-[442px]">
<!-- Decorative Background Element -->
<div class="absolute inset-0 bg-surface-container-low rounded-b-[40px] z-0"></div>
<div class="relative z-10 w-full h-full max-w-[340px] transform transition-transform duration-700 ease-out hover:scale-105">
<img class="w-full h-full object-contain drop-shadow-2xl" data-alt="A high-end, luxury minimalist wristwatch presented on a clean slate pedestal. The lighting is soft and directional, highlighting the brushed metallic finish and fine textures of the leather strap. The color palette is strictly monochrome with deep blacks and bright silver highlights against a pristine, soft-white architectural background. The image evokes a sense of quiet luxury and precision engineering in a modern light-mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBubPdA0iyCV0ZXJ0xpza0ASjjNAtKdeNHltbUnicPhA289K6V_nA1YBDIeGNDYXnV2QK6O3AHQwcERvxCp8OBkXfrDS74QrcmvQwhdTZvqGNAkaul1B7tAYuuxnigp-LRjj5PGqyy-JAg6rS_BrtweqGcqUOB_NGmeL4_3a6bVkEH-1v7NrTT5S5xIn1GQqAL3xaGIPXxUPF1YN4d9_xB1YKe8uYXQv8zDA3yunByu7cInbQ0Nohxi-A">
</div>
<!-- Floating Badge -->
<div class="absolute bottom-10 right-container-margin z-20 bg-primary text-on-primary px-base py-xs text-label-md font-label-md rounded-[2px] tracking-widest shadow-lg">
                NEW SEASON
            </div>
</section>
<!-- Messaging Section -->
<section class="w-full px-container-margin pt-xl flex flex-col items-center text-center gap-md">
<!-- Value Prop -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">
                Curated Excellence
            </h1>
<!-- Supporting Copy -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] leading-relaxed">
                Discover a world of premium brands and exclusive collections tailored for your lifestyle.
            </p>
<!-- Progress Indicators -->
<div class="flex items-center gap-xs mt-md">
<div class="h-1.5 w-8 rounded-full bg-primary transition-all duration-300"></div>
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant transition-all duration-300"></div>
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant transition-all duration-300"></div>
</div>
</section>
</main>
<!-- Footer Actions -->
<footer class="p-container-margin flex flex-col gap-md mb-safe-area">
<button class="w-full h-14 bg-primary text-on-primary font-title-lg text-title-lg flex items-center justify-center rounded-xl haptic-feedback shadow-md transition-all active:bg-primary-container">
            Next
        </button>
<p class="text-center font-label-md text-label-md text-outline">
            Step 1 of 3
        </p>
</footer>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nextButton = document.querySelector('button.bg-primary');
            const skipButton = document.querySelector('header button');
            
            // Simple haptic simulation (visual)
            const addFeedback = (btn) => {
                btn.addEventListener('click', () => {
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate(10);
                    }
                });
            };

            addFeedback(nextButton);
            addFeedback(skipButton);

            // Subtle parallax effect on scroll
            window.addEventListener('scroll', () => {
                const scrolled = window.pageYOffset;
                const hero = document.querySelector('section img');
                if (hero) {
                    hero.style.transform = `translateY(${scrolled * 0.1}px)`;
                }
            });
        });
    </script>
</body></html>
