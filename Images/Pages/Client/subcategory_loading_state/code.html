<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-wrapper {
            position: relative;
            overflow: hidden;
            background-color: #f2f4f6; /* surface-container-low */
        }
        .shimmer-wrapper::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(242, 244, 246, 0) 0%,
                rgba(226, 232, 240, 0.6) 50%,
                rgba(242, 244, 246, 0) 100%
            );
            animation: shimmer 1.5s infinite;
        }
        .haptic-tap:active { transform: scale(0.95); transition: transform 0.1s; }
        .haptic-tick:active { transform: scale(0.9); transition: transform 0.2s; }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-fixed-variant": "#38485d",
                        "outline-variant": "#c6c6cc",
                        "on-tertiary-fixed": "#0b1c30",
                        "surface-bright": "#f7f9fb",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "on-primary-fixed-variant": "#414756",
                        "inverse-surface": "#2d3133",
                        "inverse-on-surface": "#eff1f3",
                        "on-secondary": "#ffffff",
                        "secondary": "#6d5b48",
                        "inverse-primary": "#c1c6d9",
                        "surface-dim": "#d8dadc",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#d3e4fe",
                        "primary": "#000000",
                        "on-surface": "#191c1e",
                        "on-secondary-fixed": "#26190a",
                        "on-secondary-fixed-variant": "#544432",
                        "secondary-fixed": "#f7dec5",
                        "background": "#f7f9fb",
                        "on-background": "#191c1e",
                        "tertiary": "#000000",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#eceef0",
                        "primary-container": "#151b29",
                        "on-tertiary-container": "#75859d",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-container": "#7e8395",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "secondary-fixed-dim": "#dac3aa",
                        "error": "#ba1a1a",
                        "surface-tint": "#585e6f",
                        "surface": "#f7f9fb",
                        "on-surface-variant": "#45464c",
                        "on-secondary-container": "#73614d",
                        "tertiary-container": "#0b1c30",
                        "surface-variant": "#e0e3e5",
                        "secondary-container": "#f7dec5",
                        "primary-fixed": "#dde2f6",
                        "on-primary-fixed": "#151b29",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#c1c6d9",
                        "on-tertiary": "#ffffff",
                        "outline": "#76777d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "sm": "12px",
                        "base": "8px",
                        "container-margin": "20px",
                        "lg": "24px",
                        "xl": "32px",
                        "md": "16px",
                        "gutter": "12px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "price-display": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "price-display": ["24px", {"lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body-md text-body-md antialiased">
<!-- TopAppBar Shell -->
<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-md flex justify-between items-center px-container-margin h-16 w-full">
<div class="flex items-center gap-md">
<button class="haptic-tap active:scale-95 transition-transform text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary">Smartphones</h1>
</div>
<div class="flex items-center gap-md">
<button class="haptic-tap active:scale-95 transition-transform text-primary">
<span class="material-symbols-outlined">shopping_bag</span>
</button>
</div>
</header>
<main class="pt-16 pb-24 min-h-screen">
<!-- Filter Bar Skeleton -->
<section class="py-md overflow-x-auto no-scrollbar flex gap-sm px-container-margin">
<div class="shimmer-wrapper min-w-[80px] h-9 rounded-full"></div>
<div class="shimmer-wrapper min-w-[100px] h-9 rounded-full"></div>
<div class="shimmer-wrapper min-w-[70px] h-9 rounded-full"></div>
<div class="shimmer-wrapper min-w-[110px] h-9 rounded-full"></div>
<div class="shimmer-wrapper min-w-[90px] h-9 rounded-full"></div>
</section>
<!-- Results Info Skeleton -->

<div class="shimmer-wrapper w-20 h-4 rounded"></div>
</div>
<!-- Product Grid (2-Column) Skeleton -->
<section class="grid grid-cols-2 gap-gutter px-container-margin mt-sm">
<!-- Product Card 1 -->
<div class="flex flex-col gap-sm">
<div class="shimmer-wrapper aspect-[3/4] w-full rounded-xl"></div>
<div class="flex flex-col gap-xs">

</div>
</div>
<!-- Product Card 2 -->

<div class="shimmer-wrapper w-full h-4 rounded"></div>
<div class="shimmer-wrapper w-2/3 h-6 mt-1 rounded"></div>
</div>
</div>
<!-- Product Card 3 -->
<div class="flex flex-col gap-sm mt-md">
<div class="shimmer-wrapper aspect-[3/4] w-full rounded-xl"></div>
<div class="flex flex-col gap-xs">
<div class="shimmer-wrapper w-3/4 h-5 rounded"></div>
<div class="shimmer-wrapper w-5/6 h-4 rounded"></div>
<div class="shimmer-wrapper w-1/3 h-6 mt-1 rounded"></div>
</div>
</div>
<!-- Product Card 4 -->
<div class="flex flex-col gap-sm mt-md">
<div class="shimmer-wrapper aspect-[3/4] w-full rounded-xl"></div>
<div class="flex flex-col gap-xs">
<div class="shimmer-wrapper w-1/2 h-5 rounded"></div>
<div class="shimmer-wrapper w-3/4 h-4 rounded"></div>
<div class="shimmer-wrapper w-2/5 h-6 mt-1 rounded"></div>
</div>
</div>
<!-- Product Card 5 -->
<div class="flex flex-col gap-sm mt-md">
<div class="shimmer-wrapper aspect-[3/4] w-full rounded-xl"></div>
<div class="flex flex-col gap-xs">
<div class="shimmer-wrapper w-2/3 h-5 rounded"></div>
<div class="shimmer-wrapper w-full h-4 rounded"></div>
<div class="shimmer-wrapper w-1/2 h-6 mt-1 rounded"></div>
</div>
</div>
<!-- Product Card 6 -->
<div class="flex flex-col gap-sm mt-md">
<div class="shimmer-wrapper aspect-[3/4] w-full rounded-xl"></div>
<div class="flex flex-col gap-xs">
<div class="shimmer-wrapper w-3/4 h-5 rounded"></div>
<div class="shimmer-wrapper w-2/3 h-4 rounded"></div>
<div class="shimmer-wrapper w-1/3 h-6 mt-1 rounded"></div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 w-full z-50 bg-surface/90 backdrop-blur-md border-t border-outline-variant/20 shadow-sm flex justify-around items-center h-20 px-container-margin pb-safe rounded-t-xl">
<div class="flex flex-col items-center justify-center text-primary font-bold haptic-tick active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined">storefront</span>
<span class="font-label-md text-label-md">Shop</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant haptic-tick active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined">explore</span>
<span class="font-label-md text-label-md">Explore</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant haptic-tick active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined">shopping_cart</span>
<span class="font-label-md text-label-md">Cart</span>
</div>

<script>
        // Subtle interaction for the "back" button
        document.querySelector('[data-icon="arrow_back"]')?.parentElement?.addEventListener('click', () => {
            window.history.back();
        });

        // Add a gentle hover/touch state simulation for the shimmer
        // (Just visual polish for the skeleton)
    </script>
</body></html>
