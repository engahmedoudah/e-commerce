<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-bg {
            position: relative;
            overflow: hidden;
            background-color: #F1F5F9;
        }
        .shimmer-bg::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(
                90deg,
                rgba(241, 245, 249, 0) 0%,
                rgba(226, 232, 240, 0.6) 50%,
                rgba(241, 245, 249, 0) 100%
            );
            animation: shimmer 1.5s infinite;
        }
        .haptic-feedback:active {
            transform: scale(0.95);
        }
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#f7dec5",
                        "on-secondary-container": "#73614d",
                        "inverse-surface": "#2d3133",
                        "outline": "#76777d",
                        "primary": "#000000",
                        "on-tertiary-fixed": "#0b1c30",
                        "surface-container": "#eceef0",
                        "surface-bright": "#f7f9fb",
                        "on-primary-container": "#7e8395",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#6d5b48",
                        "surface-container-highest": "#e0e3e5",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c6c6cc",
                        "on-secondary-fixed-variant": "#544432",
                        "surface-container-low": "#f2f4f6",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#151b29",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#26190a",
                        "on-background": "#191c1e",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "inverse-on-surface": "#eff1f3",
                        "inverse-primary": "#c1c6d9",
                        "on-tertiary-fixed-variant": "#38485d",
                        "tertiary": "#000000",
                        "surface-dim": "#d8dadc",
                        "surface": "#f7f9fb",
                        "surface-tint": "#585e6f",
                        "on-tertiary-container": "#75859d",
                        "primary-container": "#151b29",
                        "on-surface-variant": "#45464c",
                        "background": "#f7f9fb",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#414756",
                        "tertiary-fixed": "#d3e4fe",
                        "secondary-fixed-dim": "#dac3aa",
                        "on-surface": "#191c1e",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#0b1c30",
                        "surface-container-high": "#e6e8ea",
                        "primary-fixed-dim": "#c1c6d9",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#f7dec5",
                        "primary-fixed": "#dde2f6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "sm": "12px",
                        "md": "16px",
                        "lg": "24px",
                        "gutter": "12px",
                        "xs": "4px",
                        "container-margin": "20px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "price-display": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "price-display": ["24px", {"lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface/90 flex justify-between items-center h-16 px-container-margin w-full">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
<div class="w-32 h-4 shimmer-bg rounded-full"></div>
</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight text-primary">LUXE</div>
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-primary" data-icon="search">search</span>
</button>
</header>
<main class="pt-16 px-container-margin">
<!-- 1. Search Area Skeleton -->
<div class="mt-lg">
<div class="w-full h-12 shimmer-bg rounded-lg"></div>
</div>
<!-- 2. Hero Banner Skeleton -->
<div class="mt-lg">
<div class="w-full h-48 shimmer-bg rounded-xl"></div>
</div>
<!-- 3. Category Circles Skeleton -->
<div class="mt-xl flex justify-between overflow-x-hidden">
<div class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full shimmer-bg"></div>
<div class="w-12 h-3 shimmer-bg rounded-full"></div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full shimmer-bg"></div>
<div class="w-12 h-3 shimmer-bg rounded-full"></div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full shimmer-bg"></div>
<div class="w-12 h-3 shimmer-bg rounded-full"></div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full shimmer-bg"></div>
<div class="w-12 h-3 shimmer-bg rounded-full"></div>
</div>
</div>
<!-- 4. Section Title Skeleton -->
<div class="mt-xl mb-md">
<div class="w-48 h-6 shimmer-bg rounded-full"></div>
</div>
<!-- 5-12. Product Grid (High Density) -->
<div class="grid grid-cols-2 gap-gutter">
<!-- Product Card 1 -->
<div class="space-y-2">
<div class="aspect-[4/5] w-full shimmer-bg rounded-lg"></div>
<div class="w-3/4 h-4 shimmer-bg rounded-full"></div>
<div class="w-1/2 h-4 shimmer-bg rounded-full"></div>
</div>
<!-- Product Card 2 -->
<div class="space-y-2">
<div class="aspect-[4/5] w-full shimmer-bg rounded-lg"></div>
<div class="w-3/4 h-4 shimmer-bg rounded-full"></div>
<div class="w-1/2 h-4 shimmer-bg rounded-full"></div>
</div>
<!-- Product Card 3 -->
<div class="space-y-2">
<div class="aspect-[4/5] w-full shimmer-bg rounded-lg"></div>
<div class="w-3/4 h-4 shimmer-bg rounded-full"></div>
<div class="w-1/2 h-4 shimmer-bg rounded-full"></div>
</div>
<!-- Product Card 4 -->
<div class="space-y-2">
<div class="aspect-[4/5] w-full shimmer-bg rounded-lg"></div>
<div class="w-3/4 h-4 shimmer-bg rounded-full"></div>
<div class="w-1/2 h-4 shimmer-bg rounded-full"></div>
</div>
</div>
<!-- 13. Promo Banner 2 -->
<div class="mt-xl">
<div class="w-full h-32 shimmer-bg rounded-xl"></div>
</div>
<!-- 14. Section Title 2 -->
<div class="mt-xl mb-md">
<div class="w-32 h-6 shimmer-bg rounded-full"></div>
</div>
<!-- 15-22. Horizontal Scrolling Section -->
<div class="flex gap-gutter overflow-x-hidden mt-md">
<div class="min-w-[140px] space-y-2">
<div class="aspect-square w-full shimmer-bg rounded-lg"></div>
<div class="w-full h-3 shimmer-bg rounded-full"></div>
</div>
<div class="min-w-[140px] space-y-2">
<div class="aspect-square w-full shimmer-bg rounded-lg"></div>
<div class="w-full h-3 shimmer-bg rounded-full"></div>
</div>
<div class="min-w-[140px] space-y-2">
<div class="aspect-square w-full shimmer-bg rounded-lg"></div>
<div class="w-full h-3 shimmer-bg rounded-full"></div>
</div>
</div>
<!-- 23. Featured Bento Grid Section -->
<div class="mt-xl grid grid-cols-2 grid-rows-2 gap-gutter h-64">
<div class="row-span-2 shimmer-bg rounded-xl"></div>
<div class="shimmer-bg rounded-xl"></div>
<div class="shimmer-bg rounded-xl"></div>
</div>
<!-- 24-26. Final Vertical List Items -->
<div class="mt-xl space-y-lg">
<div class="flex gap-md items-center">
<div class="w-20 h-20 shimmer-bg rounded-lg shrink-0"></div>
<div class="space-y-2 w-full">
<div class="w-3/4 h-4 shimmer-bg rounded-full"></div>
<div class="w-1/2 h-4 shimmer-bg rounded-full"></div>
</div>
</div>
<div class="flex gap-md items-center">
<div class="w-20 h-20 shimmer-bg rounded-lg shrink-0"></div>
<div class="space-y-2 w-full">
<div class="w-2/3 h-4 shimmer-bg rounded-full"></div>
<div class="w-1/3 h-4 shimmer-bg rounded-full"></div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-container-margin py-base pb-safe bg-surface/90 z-50 backdrop-blur-md">
<!-- Shop (Active) -->
<div class="flex flex-col items-center justify-center text-primary font-bold active:scale-90 transition-transform duration-200 haptic-feedback">
<span class="material-symbols-outlined" data-icon="storefront" style="font-variation-settings: 'FILL' 1;">storefront</span>
<span class="font-label-md text-label-md">Shop</span>
</div>
<!-- Explore -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 transition-transform duration-200 haptic-feedback">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-label-md text-label-md">Explore</span>
</div>
<!-- Cart -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 transition-transform duration-200 haptic-feedback">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
<span class="font-label-md text-label-md">Cart</span>
</div>
<!-- Wishlist -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 transition-transform duration-200 haptic-feedback">
<span class="material-symbols-outlined" data-icon="favorite">favorite</span>
<span class="font-label-md text-label-md">Wishlist</span>
</div>
<!-- Profile -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 transition-transform duration-200 haptic-feedback">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</div>
</nav>
</body></html>
