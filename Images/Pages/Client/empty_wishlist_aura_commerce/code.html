<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Wishlist - Aura Commerce</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-variant": "#e0e3e5",
                      "background": "#f7f9fb",
                      "primary-container": "#151b29",
                      "inverse-surface": "#2d3133",
                      "tertiary-container": "#0b1c30",
                      "surface-container-highest": "#e0e3e5",
                      "on-primary-fixed-variant": "#414756",
                      "surface-bright": "#f7f9fb",
                      "on-surface-variant": "#45464c",
                      "outline-variant": "#c6c6cc",
                      "secondary": "#6d5b48",
                      "on-tertiary-fixed-variant": "#38485d",
                      "on-error": "#ffffff",
                      "secondary-fixed-dim": "#dac3aa",
                      "on-secondary-fixed-variant": "#544432",
                      "surface-container-high": "#e6e8ea",
                      "surface-dim": "#d8dadc",
                      "tertiary": "#000000",
                      "on-error-container": "#93000a",
                      "surface-container": "#eceef0",
                      "on-primary": "#ffffff",
                      "secondary-fixed": "#f7dec5",
                      "on-secondary-container": "#73614d",
                      "surface": "#f7f9fb",
                      "tertiary-fixed-dim": "#b7c8e1",
                      "on-secondary-fixed": "#26190a",
                      "on-secondary": "#ffffff",
                      "primary-fixed-dim": "#c1c6d9",
                      "surface-tint": "#585e6f",
                      "on-tertiary-fixed": "#0b1c30",
                      "surface-container-lowest": "#ffffff",
                      "outline": "#76777d",
                      "error": "#ba1a1a",
                      "tertiary-fixed": "#d3e4fe",
                      "on-background": "#191c1e",
                      "primary": "#000000",
                      "secondary-container": "#f7dec5",
                      "on-surface": "#191c1e",
                      "on-tertiary-container": "#75859d",
                      "inverse-primary": "#c1c6d9",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed": "#151b29",
                      "error-container": "#ffdad6",
                      "primary-fixed": "#dde2f6",
                      "on-primary-container": "#7e8395",
                      "surface-container-low": "#f2f4f6",
                      "inverse-on-surface": "#eff1f3"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "base": "8px",
                      "md": "16px",
                      "gutter": "12px",
                      "xl": "32px",
                      "lg": "24px",
                      "sm": "12px",
                      "xs": "4px",
                      "container-margin": "20px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "price-display": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "display-lg": ["Inter"],
                      "title-lg": ["Inter"],
                      "label-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "price-display": ["24px", {"lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "600"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased selection:bg-surface-variant selection:text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-surface/90 flex items-center justify-between px-container-margin h-16 transition-all duration-300">
<button aria-label="Go back" class="text-on-surface-variant hover:opacity-70 transition-opacity active:scale-95 duration-300 p-2 -ml-2 rounded-full hover:bg-surface-container-low">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg tracking-tighter text-primary">Aura Commerce</h1>
<button aria-label="Shopping bag" class="text-on-surface-variant hover:opacity-70 transition-opacity active:scale-95 duration-300 p-2 -mr-2 rounded-full hover:bg-surface-container-low">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-16 pb-safe flex-1 flex flex-col items-center justify-center min-h-screen px-container-margin">
<div class="flex flex-col items-center text-center max-w-md w-full animate-fade-in-up">
<!-- Empty State Illustration/Icon -->
<div class="w-32 h-32 mb-lg flex items-center justify-center rounded-full bg-surface-container-low shadow-[0px_4px_20px_rgba(0,0,0,0.04)] relative">
<!-- Decorative subtle pulse ring -->
<div class="absolute inset-0 rounded-full border border-outline-variant/30 animate-pulse-slow"></div>
<span class="material-symbols-outlined text-[64px] text-outline opacity-60 font-light" data-icon="favorite_border">favorite_border</span>
</div>
<!-- Typography -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-sm">
                Your wishlist is waiting
            </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl max-w-[280px]">
                Save the items you love to keep track of them or share them with others.
            </p>
<!-- Call to Action -->
<a class="w-full flex items-center justify-center h-14 bg-primary text-on-primary rounded-full font-title-lg text-title-lg transition-transform active:scale-95 hover:bg-primary/90 shadow-[0px_10px_40px_rgba(0,0,0,0.08)]" href="#">
                Start Shopping
            </a>
</div>
</main>
<!-- BottomNavBar (Hidden on Web) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 pb-safe backdrop-blur-xl border-t border-outline-variant/30 bg-surface/90 flex justify-around items-center h-20 px-base">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 p-2 rounded-lg w-16">
<span aria-hidden="true" class="material-symbols-outlined mb-1" data-icon="storefront">storefront</span>
<span class="font-label-md text-label-md">Shop</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 p-2 rounded-lg w-16">
<span aria-hidden="true" class="material-symbols-outlined mb-1" data-icon="assignment_return">assignment_return</span>
<span class="font-label-md text-label-md">Returns</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 p-2 rounded-lg w-16">
<span aria-hidden="true" class="material-symbols-outlined mb-1" data-icon="military_tech">military_tech</span>
<span class="font-label-md text-label-md">Rewards</span>
</button>
<button class="flex flex-col items-center justify-center text-primary font-semibold hover:bg-surface-container-low transition-colors active:scale-90 p-2 rounded-lg w-16">
<span aria-hidden="true" class="material-symbols-outlined mb-1 fill" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 p-2 rounded-lg w-16">
<span aria-hidden="true" class="material-symbols-outlined mb-1" data-icon="menu">menu</span>
<span class="font-label-md text-label-md">More</span>
</button>
</nav>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        
        @keyframes pulseSlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .animate-pulse-slow {
            animation: pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        /* Safe area padding for mobile */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 24px);
        }
    </style>
<script>
        // Simple haptic feedback simulation for buttons
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('click', () => {
                if (navigator.vibrate) {
                    navigator.vibrate(10); // Light haptic "tick"
                }
            });
        });
        
        // Haptic for primary action
        document.querySelector('.bg-primary').addEventListener('click', () => {
             if (navigator.vibrate) {
                    navigator.vibrate([15, 30, 15]); // Medium "thump"
                }
        });
    </script>
</body></html>
