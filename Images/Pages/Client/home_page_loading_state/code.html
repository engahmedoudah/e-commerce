<style>

            background-size: 200% 100%;

        }

            0% { background-position: -200% 0; }

<script>
        // Haptic Feedback Simulation
        document.querySelectorAll('.haptic-feedback').forEach(el => {
            el.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(5);
                }
            });
        });

        // Simulate micro-interactions for active state
        const navItems = document.querySelectorAll('nav > div');
        navItems.forEach(item => {
            item.addEventListener('click', function() {
                navItems.forEach(i => {
                    i.classList.remove('text-primary', 'dark:text-primary-fixed', 'font-bold');
                    i.classList.add('text-on-surface-variant', 'dark:text-outline');
                    const icon = i.querySelector('.material-symbols-outlined');
                    if (icon) icon.style.fontVariationSettings = "'FILL' 0";
                });
                this.classList.add('text-primary', 'dark:text-primary-fixed', 'font-bold');
                this.classList.remove('text-on-surface-variant', 'dark:text-outline');
                const icon = this.querySelector('.material-symbols-outlined');
                if (icon) icon.style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
